<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SentoBene | شاشة طلبات الكاشير</title>
  <script src="https://jsdelivr.net"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #090b0a;
      color: #f7f3eb;
      font-family: Tahoma, Arial, sans-serif;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      background: #111413;
      padding: 15px 25px;
      border-radius: 12px;
      border: 1px solid #302b23;
      margin-bottom: 25px;
    }
    .top-bar h1 {
      margin: 0;
      color: #d7a33a;
      font-size: 22px;
    }
    .btn-group {
      display: flex;
      gap: 10px;
    }
    .sound-btn {
      background: #d7a33a;
      color: #000000 !important;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .sound-btn.active {
      background: #2e7d32;
      color: #ffffff !important;
    }
    .test-btn {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }
    .orders-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }
    .order-card {
      background: #111413;
      border: 2px solid #d7a33a;
      border-radius: 12px;
      padding: 20px;
    }
    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #302b23;
      padding-bottom: 12px;
      margin-bottom: 15px;
    }
    .table-badge {
      background: #d7a33a;
      color: #000;
      font-size: 20px;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 8px;
    }
    .order-time {
      color: #aaa49b;
      font-size: 14px;
    }
    .items-list {
      list-style: none;
      padding: 0;
      margin: 0 0 15px 0;
    }
    .items-list li {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px dashed #302b23;
      font-size: 16px;
    }
    .item-qty {
      color: #f0c15d;
      font-weight: bold;
      margin-left: 8px;
    }
    .order-notes {
      background: #1d1a14;
      color: #f0c15d;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 15px;
    }
    .order-total {
      font-size: 18px;
      font-weight: bold;
      color: #d7a33a;
      text-align: left;
      margin-bottom: 15px;
    }
    .done-btn {
      width: 100%;
      background: #2e7d32;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .empty-msg {
      text-align: center;
      color: #aaa49b;
      font-size: 18px;
      margin-top: 60px;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <h1>🔔 طلبات الترابيزات المباشرة - SentoBene</h1>
    <div class="btn-group">
      <button id="soundBtn" class="sound-btn" onclick="enableSound()">اضغط لتفعيل الصوت 🔊</button>
      <button class="test-btn" onclick="playBell()">تجربة الجرس 🔔</button>
    </div>
  </div>

  <div id="ordersContainer" class="orders-grid"></div>
  <div id="emptyMsg" class="empty-msg">لا توجد طلبات جديدة حالياً... في انتظار طلبات الترابيزات</div>

  <script>
    var soundEnabled = false;
    var audioCtx = null;

    function enableSound() {
      soundEnabled = true;
      var btn = document.getElementById('soundBtn');
      btn.innerHTML = 'الصوت مُفعّل ويعمل ✅';
      btn.className = 'sound-btn active';
      playBell();
    }

    function playBell() {
      try {
        var AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!audioCtx && AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
        if (audioCtx) {
          if (audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
          var osc = audioCtx.createOscillator();
          var gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, audioCtx.currentTime);
          osc.frequency.setValueAtTime(1100, audioCtx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.8);
        }
      } catch (e) {
        alert('تم تفعيل التنبيهات');
      }
    }

    var SUPABASE_URL = 'https://supabase.co';
    var SUPABASE_ANON_KEY = 'sb_publishable_Ww0JsdHQ9pjMFVfq9nD1zg_S51NeW6n';
    var sb = null;
    var lastOrderCount = 0;

    if (window.supabase) {
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    function loadOrders() {
      if (!sb) return;
      sb.from('orders')
        .select('*')
        .eq('status', 'pending')
        .order('created_at', { ascending: true })
        .then(function(res) {
          var data = res.data;
          var container = document.getElementById('ordersContainer');
          var emptyMsg = document.getElementById('emptyMsg');

          if (!data || data.length === 0) {
            container.innerHTML = '';
            emptyMsg.style.display = 'block';
            lastOrderCount = 0;
            return;
          }

          if (data.length > lastOrderCount && soundEnabled) {
            playBell();
          }
          lastOrderCount = data.length;

          emptyMsg.style.display = 'none';
          var html = '';
          for (var i = 0; i < data.length; i++) {
            var order = data[i];
            var d = new Date(order.created_at);
            var time = d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
            var itemsHtml = '';
            for (var j = 0; j < order.items.length; j++) {
              var item = order.items[j];
              itemsHtml += '<li><span><span class="item-qty">' + item.qty + 'x</span> ' + item.name + '</span><span>' + (item.price * item.qty) + ' ج.م</span></li>';
            }

            html += '<div class="order-card">' +
              '<div class="order-header">' +
                '<span class="table-badge">ترابيزة ' + order.table_number + '</span>' +
                '<span class="order-time">⏰ ' + time + '</span>' +
              '</div>' +
              '<ul class="items-list">' + itemsHtml + '</ul>' +
              (order.notes ? '<div class="order-notes">📝 ملاحظات: ' + order.notes + '</div>' : '') +
              '<div class="order-total">الإجمالي (قبل الضريبة): ' + order.total_price + ' ج.م</div>' +
              '<button class="done-btn" onclick="completeOrder(' + order.id + ')">تم الإدخال على تنمية ✅</button>' +
            '</div>';
          }
          container.innerHTML = html;
        });
    }

    function completeOrder(id) {
      if (!sb) return;
      sb.from('orders').update({ status: 'completed' }).eq('id', id).then(function() {
        loadOrders();
      });
    }

    if (sb) {
      loadOrders();
      setInterval(loadOrders, 4000);
    }
  </script>
</body>
</html>
