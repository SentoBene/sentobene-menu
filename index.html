<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SentoBene | Menu</title>
<script src="https://jsdelivr.net"></script>
<style>
:root{--bg:#090b0a;--card:#111413;--gold:#d7a33a;--gold2:#f0c15d;--text:#f7f3eb;--muted:#aaa49b;--line:#302b23;--danger:#b94b4b;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:"Times New Roman",Times,serif;direction:ltr;}
body{min-height:100vh;}
button,input,textarea,select{font:inherit;}
button{cursor:pointer;}
a{color:inherit;}
.header{width:100%;max-width:1100px;margin:0 auto;padding:20px 16px 8px;text-align:center;}
.logo{display:block;width:min(220px,72vw);max-height:130px;object-fit:contain;margin:0 auto;}
.social{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:9px;direction:ltr;}
.social a{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--gold2);text-decoration:none;border:1px solid #3a352d;border-radius:50%;background:#111413;transition:.2s ease;}
.social a:hover{background:var(--gold);color:#111;border-color:var(--gold);}
.social svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.social a:last-child svg{fill:currentColor;stroke:none;}
.socialName{font-family:"Times New Roman",Times,serif;font-size:16px;font-weight:700;color:var(--gold2);letter-spacing:.3px;}
.public{width:min(1100px,100%);margin:0 auto;padding:0 14px 30px;direction:ltr;}
.cats{display:flex;flex-wrap:nowrap;align-items:center;gap:8px;width:100%;overflow-x:auto;overflow-y:hidden;padding:15px 2px 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch;direction:ltr;white-space:nowrap;scroll-behavior:smooth;}
.cats::-webkit-scrollbar{display:none;}
.cats button{flex:0 0 auto;direction:ltr;white-space:nowrap;border:1px solid #3a352d;background:#111413;color:#ddd;border-radius:999px;padding:9px 14px;font-family:"Times New Roman",Times,serif;font-weight:700;font-size:15px;line-height:1.2;text-transform:capitalize;cursor:pointer;transition:.2s ease;}
.cats button:hover{border-color:var(--gold);}
.cats button.active{background:var(--gold);border-color:var(--gold);color:#111;font-weight:800;}
.sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:5px 0 14px;padding-bottom:9px;border-bottom:1px solid var(--line);direction:ltr;}
.sectionTitle h2{margin:0;font-family:"Times New Roman",Times,serif;font-weight:700;font-size:21px;line-height:1.2;text-transform:capitalize;}
.sectionTitle span{font-size:11px;color:var(--muted);font-family:"Times New Roman",Times,serif;}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;direction:ltr;}
.card{overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 25px rgba(0,0,0,.16);direction:ltr;min-width:0;}
.photo{width:100%;aspect-ratio:1.55;background:radial-gradient(circle at 50% 40%,#30281c,#171a18 70%);display:flex;align-items:center;justify-content:center;color:#8e806a;text-align:center;padding:12px;}
.photo img{width:100%;height:100%;object-fit:cover;border-radius:8px;display:block;}
.info{padding:12px 13px 13px;direction:ltr;text-align:left;min-width:0;}
.name{font-family:"Times New Roman",Times,serif;font-weight:700;font-size:17px;line-height:1.3;text-transform:capitalize;color:var(--text);overflow-wrap:anywhere;}
.desc{font-family:"Times New Roman",Times,serif;font-size:12px;color:var(--muted);line-height:1.55;margin:5px 0 10px;min-height:34px;overflow-wrap:anywhere;}
.bottom{display:flex;align-items:flex-start;justify-content:flex-start;min-width:0;}
.price{color:var(--gold2);font-family:"Times New Roman",Times,serif;font-weight:900;font-size:17px;line-height:1.2;white-space:nowrap;text-transform:none;min-width:0;}
.price.multiPrice{white-space:normal;line-height:1.4;font-size:15px;}
.empty{padding:35px 15px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;}
.footer{text-align:center;color:#777;font-size:11px;padding:25px 10px 35px;}
.admin{display:none;width:min(1100px,100%);margin:0 auto;padding:20px 14px 40px;direction:rtl;}
.admin.show{display:block;}
.adminHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px;}
.adminHead h2{margin:0;font-family:"Times New Roman",Times,serif;font-size:24px;}
.adminActions{display:flex;gap:8px;flex-wrap:wrap;}
.btn{border:1px solid var(--line);background:#151816;color:#eee;border-radius:9px;padding:9px 13px;font-weight:700;}
.btn:hover{border-color:var(--gold);}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#111;}
.btn.danger{background:#351919;border-color:#5c2828;color:#f1caca;}
.adminGrid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:18px;}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;}
.panel h3{margin:0 0 14px;font-size:18px;font-family:"Times New Roman",Times,serif;}
.formGroup{margin-bottom:12px;}
.formGroup label{display:block;margin-bottom:5px;color:#ddd;font-size:13px;font-weight:700;}
.formGroup input,.formGroup textarea,.formGroup select{width:100%;border:1px solid #3a352d;background:#0c0f0e;color:#fff;border-radius:9px;padding:10px 11px;outline:none;}
.formGroup input:focus,.formGroup textarea:focus,.formGroup select:focus{border-color:var(--gold);}
.formGroup textarea{min-height:90px;resize:vertical;}
.formRow{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.formButtons{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.adminList{display:grid;gap:10px;}
.adminItem{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px;border:1px solid var(--line);border-radius:11px;background:#0c0f0e;}
.adminItemInfo{min-width:0;}
.adminItemName{font-family:"Times New Roman",Times,serif;font-weight:700;font-size:16px;text-transform:capitalize;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.adminItemMeta{color:var(--muted);font-size:11px;margin-top:3px;}
.adminItemActions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.smallBtn{border:1px solid #3a352d;background:#151816;color:#ddd;border-radius:7px;padding:6px 9px;font-size:11px;font-weight:700;}
.smallBtn:hover{border-color:var(--gold);}
.smallBtn.active{background:var(--gold);border-color:var(--gold);color:#111;}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.78);padding:20px;z-index:9999;}
.modal.show{display:flex;}
.modalBox{width:min(400px,100%);background:#111413;border:1px solid var(--line);border-radius:15px;padding:20px;box-shadow:0 20px 70px rgba(0,0,0,.5);}
.modalBox h2{margin:0 0 16px;text-align:center;font-family:"Times New Roman",Times,serif;}
.modalButtons{display:flex;gap:8px;margin-top:12px;}
.modalButtons button{flex:1;}
.loginError{color:#ef8d8d;font-size:12px;min-height:18px;margin-top:7px;}
.loading{text-align:center;color:var(--muted);padding:30px 10px;}
@media(max-width:700px){.header{padding-top:15px;}.logo{width:min(190px,70vw);max-height:110px;}.public{padding-left:10px;padding-right:10px;}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}.photo{aspect-ratio:1.25;}.info{padding:10px;}.name{font-size:16px;}.price{font-size:16px;}.price.multiPrice{font-size:14px;}.adminGrid{grid-template-columns:1fr;}.adminHead{align-items:flex-start;flex-direction:column;}}
@media(max-width:430px){
  .name{font-size:15px;}
  .price{font-size:15px;}
  .price.multiPrice{font-size:13px;line-height:1.35;}
  .cats button{font-size:14px;padding:8px 13px;}
}
body.adminMode .public{display:none;}
body.adminMode .admin{display:block;}
body.adminMode .footer{display:none;}
</style>
</head>
<body>
<div class="public" id="public">
  <header class="header">
    <img class="logo" src="ChatGPT Image Sep 1, 2026, 08_20_26 PM.png" alt="SentoBene">
    <div class="social">
      <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="1"></circle></svg>
      </a>
      <span class="socialName">SentoBene</span>
      <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 8h3V4h-3c-3.3 0-5 2-5 5v3H6v4h3v4h4v-4h3l1-4h-4V9c0-.7.3-1 1-1z"></path></svg>
      </a>
    </div>
  </header>
  <div id="cats" class="cats"></div>
  <section class="sectionTitle">
    <h2 id="sectionName">Pasta</h2>
    <span id="count">0 Items</span>
  </section>
  <main id="products" class="grid"><div class="loading">Loading...</div></main>
  <footer class="footer">SentoBene®</footer>
</div>
<section id="admin" class="admin">
  <div class="adminHead">
    <h2>SentoBene Admin</h2>
    <div class="adminActions">
      <button class="btn" onclick="showPublic()">عرض المينيو</button>
      <button class="btn danger" onclick="logout()">تسجيل الخروج</button>
    </div>
  </div>
  <div class="adminGrid">
    <div class="panel">
      <h3>إضافة / تعديل صنف</h3>
      <input type="hidden" id="editId">
      <div class="formGroup">
        <label>اسم الصنف</label>
        <input id="name" type="text" placeholder="Chicken Alfredo Pasta">
      </div>
      <div class="formGroup">
        <label>الوصف</label>
        <textarea id="description" placeholder="وصف الصنف"></textarea>
      </div>
      <div class="formRow">
        <div class="formGroup">
          <label>القسم</label>
          <select id="category"></select>
        </div>
        <div class="formGroup">
          <label>السعر بالجنيه</label>
