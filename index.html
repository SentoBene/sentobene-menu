*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Tahoma,sans-serif}body{min-height:100vh}button,input,textarea,select{font:inherit}

lateX(-50%);background:#171a18;border:1px solid #3a352d;padding:11px 15px;border-radius:12px;display:none;z-index:120}.toast.show{display:block}
}</style>
