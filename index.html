        :root {
            --primary-color: #d63031;
            --bg-color: #f8f9fa;
            --text-color: #2d3436;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: #ffffff;
            text-align: center;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .header h1 {
            color: var(--primary-color);
            margin: 0;
            font-size: 32px;
            font-weight: bold;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .category-title {
            border-right: 4px solid var(--primary-color);
            padding-right: 10px;
            margin: 30px 0 20px;
            color: var(--primary-color);
            font-size: 24px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        @media(min-width: 768px) {
            .products-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        .product-card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            transition: 0.3s;
        }
        .product-card:hover {
            transform: translateY(-3px);
        }
        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #eee;
        }
        .product-info {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-info h3 {
            margin: 0 0 10px;
            font-size: 18px;
            font-weight: bold;
        }
        .product-info p {
            font-size: 14px;
            color: #636e72;
            margin: 0 0 15px;
            line-height: 1.5;
        }
        .product-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .product-info .price {
            font-weight: bold;
            color: var(--primary-color);
            font-size: 16px;
        }
    </style>

<script>
const SUPABASE_URL='https://xzyobcexywacsjlatntx.supabase.co';
const SUPABASE_KEY='sb_publishable_Ww0JsdHQ9pjMFVfq9nD1zg_S51NeW6n';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const cats=['PASTA','SANDWICHES','PORIZZA','MAIN COURSE','SIDE ITEM','DESSERTS','SPECIAL MOCKTAILS','HOT DRINKS','FRESH JUICE','MILK SHAKE','ICED DRINKS'];
const demo=[
['Chicken Alfredo Pasta','مكرونة بالدجاج مع صوص الألفريدو والجبن',140,'PASTA'],['Penne Arrabbiata','مكرونة بيني بصوص الطماطم الحار',120,'PASTA'],['Spaghetti Bolognese','مكرونة سباجيتي بصلصة بولونيز',130,'PASTA'],['Pesto Pasta','مكرونة بصوص البيستو',125,'PASTA'],['Chicken Sandwich','ساندوتش دجاج بصوص خاص',160,'SANDWICHES'],['Margherita Porizza','طماطم وموتزاريلا وريحان',170,'PORIZZA']
];
let active=cats[0], products=[];
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2500)}
function setupCats(){document.getElementById('cats').innerHTML=cats.map(c=>`<button class="${c===active?'active':''}" onclick="active='${c}';renderPublic()">${c}</button>`).join('');document.getElementById('pcat').innerHTML=cats.map(c=>`<option>${c}</option>`).join('')}
function esc(s){return String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
async function loadPublic(){const {data,error}=await sb.from('products').select('*').eq('available',true).order('created_at',{ascending:false});if(error){document.getElementById('count').textContent='';document.getElementById('products').innerHTML='<div class="empty">تعذر تحميل المنيو حاليًا.</div>';return}products=data||[];renderPublic()}
function renderPublic(){document.getElementById('cats').innerHTML=cats.map(c=>`<button class="${c===active?'active':''}" onclick="active='${c}';renderPublic()">${c}</button>`).join('');document.getElementById('sectionName').textContent=active;const arr=products.filter(x=>x.category===active);document.getElementById('count').textContent=arr.length+' أصناف';document.getElementById('products').innerHTML=arr.length?arr.map(x=>`<article class="card"><div class="photo">${x.image_url?`<img src="${esc(x.image_url)}" alt="${esc(x.name)}" loading="lazy">`:`<span>صورة المنتج</span>`}</div><div class="info"><div class="name">${esc(x.name)}</div><div class="desc">${esc(x.description||'')}</div><div class="bottom"><span class="price">${Number(x.price).toLocaleString('en-US')} EGP</span></div></div></article>`).join(''):'<div class="empty">لا توجد أصناف متاحة حاليًا في هذا القسم.</div>'}
async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;document.getElementById('loginError').textContent='';if(!email||!password){document.getElementById('loginError').textContent='اكتب الإيميل والباسورد.';return}const {error}=await sb.auth.signInWithPassword({email,password});if(error){document.getElementById('loginError').textContent='بيانات الدخول غير صحيحة أو الحساب غير مؤكد.';return}closeLogin();await showAdmin()}
function openLogin(){document.getElementById('loginModal').classList.add('show');setTimeout(()=>document.getElementById('email').focus(),100)}function closeLogin(){document.getElementById('loginModal').classList.remove('show');document.getElementById('loginError').textContent=''}
async function logout(){await sb.auth.signOut();showPublic();toast('تم تسجيل الخروج')}
async function showAdmin(){const {data:{user}}=await sb.auth.getUser();if(!user){openLogin();return}document.getElementById('public').classList.add('hide');document.getElementById('admin').classList.add('show');setupCats();resetForm();await loadAdmin()}
async function showPublic(){document.getElementById('admin').classList.remove('show');document.getElementById('public').classList.remove('hide');await loadPublic()}
async function loadAdmin(){const {data,error}=await sb.from('products').select('*').order('created_at',{ascending:false});if(error){toast('حصل خطأ في تحميل الأصناف');return}products=data||[];renderAdmin()}
function renderAdmin(){document.getElementById('adminItems').innerHTML=products.length?products.map(x=>`<div class="item"><div class="itemMain">${x.image_url?`<img class="thumb" src="${esc(x.image_url)}">`:'<div class="thumb"></div>'}<div class="itemText"><b>${esc(x.name)}</b><div class="small">${esc(x.category)} • ${Number(x.price).toLocaleString('en-US')} جنيه • ${x.available?'متاح':'غير متاح'}</div></div></div><div class="actions"><button class="status ${x.available?'':'off'}" onclick="toggleAvailability('${x.id}',${!x.available})">${x.available?'إخفاء':'إظهار'}</button><button class="btn dark" onclick="editProduct('${x.id}')">تعديل</button><button class="btn danger" onclick="deleteProduct('${x.id}')">حذف</button></div></div>`).join(''):'<div class="small">لا توجد أصناف. اضغط إضافة الأصناف التجريبية أو أضف صنفًا جديدًا.</div>'}
function resetForm(){document.getElementById('pid').value='';document.getElementById('pname').value='';document.getElementById('pdesc').value='';document.getElementById('pprice').value='';document.getElementById('pcat').value=cats[0];document.getElementById('pimage').value='';document.getElementById('preview').style.display='none';document.getElementById('formTitle').textContent='إضافة صنف';document.getElementById('saveBtn').textContent='حفظ الصنف';document.getElementById('cancelBtn').style.display='none'}
function editProduct(id){const x=products.find(p=>String(p.id)===String(id));if(!x)return;document.getElementById('pid').value=x.id;document.getElementById('pname').value=x.name;document.getElementById('pdesc').value=x.description||'';document.getElementById('pprice').value=x.price;document.getElementById('pcat').value=x.category;document.getElementById('pimage').value='';if(x.image_url){document.getElementById('preview').src=x.image_url;document.getElementById('preview').style.display='block'}else document.getElementById('preview').style.display='none';document.getElementById('formTitle').textContent='تعديل الصنف';document.getElementById('saveBtn').textContent='حفظ التعديل';document.getElementById('cancelBtn').style.display='inline-block';scrollTo({top:0,behavior:'smooth'})}
async function uploadImage(file){if(!file)return null;const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');const path=`${Date.now()}-${crypto.randomUUID()}.${ext||'jpg'}`;const {error}=await sb.storage.from('product-images').upload(path,file,{upsert:false,contentType:file.type||'image/jpeg'});if(error)throw error;const {data}=sb.storage.from('product-images').getPublicUrl(path);return data.publicUrl}
async function saveProduct(){const name=document.getElementById('pname').value.trim();if(!name){toast('اكتب اسم الصنف');return}const btn=document.getElementById('saveBtn');btn.disabled=true;btn.textContent='جاري الحفظ...';try{const id=document.getElementById('pid').value;const file=document.getElementById('pimage').files[0];let image_url=null;if(file){image_url=await uploadImage(file)}const payload={name,description:document.getElementById('pdesc').value.trim(),price:Number(document.getElementById('pprice').value||0),category:document.getElementById('pcat').value};if(image_url)payload.image_url=image_url;if(id){const {error}=await sb.from('products').update(payload).eq('id',id);if(error)throw error;toast('تم تعديل الصنف')}else{payload.available=true;const {error}=await sb.from('products').insert(payload);if(error)throw error;toast('تمت إضافة الصنف')}resetForm();await loadAdmin()}catch(e){console.error(e);toast('حصل خطأ أثناء الحفظ')}finally{btn.disabled=false;btn.textContent=document.getElementById('pid').value?'حفظ التعديل':'حفظ الصنف'}}
async function toggleAvailability(id,value){const {error}=await sb.from('products').update({available:value}).eq('id',id);if(error){toast('تعذر تغيير الحالة');return}await loadAdmin();toast(value?'تم إظهار الصنف':'تم إخفاء الصنف')}
async function deleteProduct(id){const x=products.find(p=>String(p.id)===String(id));if(!x)return;if(!confirm(`حذف "${x.name}" نهائيًا؟`))return;const {error}=await sb.from('products').delete().eq('id',id);if(error){toast('تعذر حذف الصنف');return}await loadAdmin();toast('تم حذف الصنف')}
async function seedDemo(){if(!confirm('إضافة الأصناف التجريبية الستة إلى قاعدة البيانات؟'))return;const {count}=await sb.from('products').select('id',{count:'exact',head:true});if(count>0){toast('قاعدة البيانات فيها أصناف بالفعل');return}const rows=demo.map(d=>({name:d[0],description:d[1],price:d[2],category:d[3],available:true}));const {error}=await sb.from('products').insert(rows);if(error){toast('تعذر إضافة الأصناف التجريبية');return}await loadAdmin();toast('تمت إضافة الأصناف التجريبية')}
document.getElementById('pimage').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{document.getElementById('preview').src=r.result;document.getElementById('preview').style.display='block'};r.readAsDataURL(f)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLogin();if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='a'){e.preventDefault();openLogin()}});
sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT')showPublic()});
setupCats();loadPublic();
