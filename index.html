<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SentoBene | Menu</title>
<script src="https://jsdelivr.net"></script>
<style>
:root{--bg:#090b0a;--card:#111413;--gold:#d7a33a;--gold2:#f0c15d;--text:#f7f3eb;--muted:#aaa49b;--line:#302b23;--danger:#b94b4b;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:"Times New Roman",Times,serif;direction:ltr;}
body{min-height:100vh;}
button,input,textarea,select{font:inherit;}
button{cursor:pointer;}
a{color:inherit;}
.header{width:100%;max-width:1100px;margin:0 auto;padding:20px 16px 8px;text-align:center;}
.logo{display:block;width:min(220px,72vw);max-height:130px;object-fit:contain;margin:0 auto;}
.social{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:9px;direction:ltr;}
.social a{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--gold2);text-decoration:none;border:1px solid #3a352d;border-radius:50%;background:#111413;transition:.2s ease;}
.social a:hover{background:var(--gold);color:#111;border-color:var(--gold);}
.social svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.social a:last-child svg{fill:currentColor;stroke:none;}
.socialName{font-family:"Times New Roman",Times,serif;font-size:16px;font-weight:700;color:var(--gold2);letter-spacing:.3px;}
.public{width:min(1100px,100%);margin:0 auto;padding:0 14px 30px;direction:ltr;}
.cats{display:flex;flex-wrap:nowrap;align-items:center;gap:8px;width:100%;overflow-x:auto;overflow-y:hidden;padding:15px 2px 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch;direction:ltr;white-space:nowrap;scroll-behavior:smooth;}
.cats::-webkit-scrollbar{display:none;}
.cats button{flex:0 0 auto;direction:ltr;white-space:nowrap;border:1px solid #3a352d;background:#111413;color:#ddd;border-radius:999px;padding:9px 14px;font-family:"Times New Roman",Times,serif;font-weight:700;font-size:15px;line-height:1.2;text-transform:capitalize;cursor:pointer;transition:.2s ease;}
.cats button:hover{border-color:var(--gold);}
.cats button.active{background:var(--gold);border-color:var(--gold);color:#111;font-weight:800;}
.sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:5px 0 14px;padding-bottom:9px;border-bottom:1px solid var(--line);direction:ltr;}
.sectionTitle h2{margin:0;font-family:"Times New Roman",Times,serif;font-weight:700;font-size:21px;line-height:1.2;text-transform:capitalize;}
.sectionTitle span{font-size:11px;color:var(--muted);font-family:"Times New Roman",Times,serif;}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;direction:ltr;}
.card{overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 25px rgba(0,0,0,.16);direction:ltr;min-width:0;}
.photo{width:100%;aspect-ratio:1.55;background:radial-gradient(circle at 50% 40%,#30281c,#171a18 70%);display:flex;align-items:center;justify-content:center;color:#8e806a;text-align:center;padding:12px;}
.photo img{width:100%;height:100%;object-fit:cover;border-radius:8px;display:block;}
.info{padding:12px 13px 13px;direction:ltr;text-align:left;min-width:0;}
.name{font-family:"Times New Roman",Times,serif;font-weight:700;font-size:17px;line-height:1.3;text-transform:capitalize;color:var(--text);overflow-wrap:anywhere;}
.desc{font-family:"Times New Roman",Times,serif;font-size:12px;color:var(--muted);line-height:1.55;margin:5px 0 10px;min-height:34px;overflow-wrap:anywhere;}
.bottom{display:flex;align-items:flex-start;justify-content:flex-start;min-width:0;}
.price{color:var(--gold2);font-family:"Times New Roman",Times,serif;font-weight:900;font-size:17px;line-height:1.2;white-space:nowrap;text-transform:none;min-width:0;}
.price.multiPrice{white-space:normal;line-height:1.4;font-size:15px;}
.empty{padding:35px 15px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;}
.footer{text-align:center;color:#777;font-size:11px;padding:25px 10px 35px;}
<section id="admin" class="admin">
  <div class="adminHead">
    <h2>SentoBene Admin</h2>
    <div class="adminActions">
      <button class="btn" onclick="showPublic()">عرض المينيو</button>
      <button class="btn danger" onclick="logout()">تسجيل الخروج</button>
    </div>
  </div>
  <div class="adminGrid">
    <div class="panel">
      <h3>إضافة / تعديل صنف</h3>
      <input type="hidden" id="editId">
      <div class="formGroup">
        <label>اسم الصنف</label>
        <input id="name" type="text" placeholder="Chicken Alfredo Pasta">
      </div>
      <div class="formGroup">
        <label>الوصف</label>
        <textarea id="description" placeholder="وصف الصنف"></textarea>
      </div>
      <div class="formRow">
        <div class="formGroup">
          <label>القسم</label>
          <select id="category"></select>
        </div>
        <div class="formGroup">
          <label>السعر بالجنيه</label>
          <input id="price" type="number" min="0" step="0.01" placeholder="140">
        </div>
      </div>
      <div class="formGroup">
        <label>صورة المنتج</label>
        <input id="image" type="file" accept="image/*">
      </div>
      <div class="formButtons">
        <button class="btn gold" onclick="saveProduct()">حفظ الصنف</button>
        <button class="btn" onclick="clearForm()">إلغاء</button>
      </div>
    </div>
    <div class="panel">
      <h3>الأصناف</h3>
      <div id="adminList" class="adminList"><div class="loading">Loading...</div></div>
    </div>
  </div>
</section>
<div id="loginModal" class="modal">
  <div class="modalBox">
    <h2>دخول إدارة SentoBene</h2>
    <div class="formGroup">
      <label>البريد الإلكتروني</label>
      <input id="loginEmail" type="email" autocomplete="username" placeholder="Email">
    </div>
    <div class="formGroup">
      <label>كلمة المرور</label>
      <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Password">
    </div>
    <div id="loginError" class="loginError"></div>
    <div class="modalButtons">
      <button class="btn gold" onclick="login()">دخول</button>
      <button class="btn" onclick="closeLogin()">إلغاء</button>
    </div>
  </div>
</div>
<script>
const SUPABASE_URL = 'https://supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Ww0JsdHQ9pjMFVfq9nD1zg_S51NeW6n';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const cats = [
  { db:'PASTA', name:'Pasta' }, { db:'SANDWICHES', name:'Sandwiches' },
  { db:'PORIZZA', name:'Purezza' }, { db:'MAIN COURSE', name:'Main Course' },
  { db:'SIDE ITEM', name:'Side Items' }, { db:'DESSERTS', name:'Desserts' },
  { db:'SPECIAL MOCKTAILS', name:'Special Mocktails' }, { db:'HOT DRINKS', name:'Hot Drinks' },
  { db:'FRESH JUICE', name:'Fresh Juices' }, { db:'MILK SHAKE', name:'Milkshakes' },
  { db:'ICED DRINKS', name:'Iced Drinks' }
];
let products = [];
let active = cats[0].db;
function esc(value){return String(value ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
function titleCase(text){return String(text || '').toLowerCase().replace(/\b\w/g,char => char.toUpperCase());}
function setupCats(){
  const container = document.getElementById('cats');
  if(container) {
    container.innerHTML = cats.map(c => `
      <button class="${c.db === active ? 'active' : ''}" onclick="selectCategory('${c.db}')">${esc(titleCase(c.name))}</button>
    `).join('');
  }
}
function selectCategory(category){ active = category; renderPublic(); }

async function loadPublic(){
  const container = document.getElementById('products');
  if(container) container.innerHTML = `<div class="loading">Loading...</div>`;
  try {
    const response = await fetch('./menu.json');
    if (!response.ok) throw new Error('menu.json error');
    products = await response.json();
    renderPublic();
  } catch (error) {
    console.error(error);
    if(container) container.innerHTML = `<div class="empty">حصل خطأ أثناء تحميل المينيو.</div>`;
  }
}
function renderPublic(){
  setupCats();
  let sectionProducts = products.filter(x => x.category === active && x.available === true);
  if(active === 'HOT DRINKS'){
    sectionProducts.sort((a,b) => {
      const aName = String(a.name || '').trim().toLowerCase();
      const bName = String(b.name || '').trim().toLowerCase();
      const order = { 'espresso':0, 'turkish coffee':1 };
      const aOrder = Object.prototype.hasOwnProperty.call(order, aName) ? order[aName] : 2;
      const bOrder = Object.prototype.hasOwnProperty.call(order, bName) ? order[bName] : 2;
      return aOrder !== bOrder ? aOrder - bOrder : 0;
    });
  }
  const currentCat = cats.find(c => c.db === active);
  const secNameEl = document.getElementById('sectionName');
  if(secNameEl) secNameEl.textContent = currentCat ? titleCase(currentCat.name) : titleCase(active);
  const countEl = document.getElementById('count');
  if(countEl) countEl.textContent = `${sectionProducts.length} ${sectionProducts.length === 1 ? 'Item' : 'Items'}`;
  const container = document.getElementById('products');
  if(!container) return;
  if(!sectionProducts.length){
    container.innerHTML = `<div class="empty">لا توجد أصناف متاحة في هذا القسم حاليًا.</div>`;
    return;
  }
  container.innerHTML = sectionProducts.map(x => {
    const productName = String(x.name || '').trim().toLowerCase();
    const isMultiPrice = productName === 'espresso' || productName === 'turkish coffee';
    const displayDescription = isMultiPrice ? '' : esc(x.description || '');
    const displayPrice = productName === 'espresso' ? 'Single 56 EGP<br>Double 64 EGP' : productName === 'turkish coffee' ? 'Single 52 EGP<br>Double 60 EGP' : `EGP ${Number(x.price).toLocaleString('en-US')}`;
    return `<div class="card"><div class="photo">${x.image_url ? `<img src="\({esc(x.image_url)}" alt="\){esc(titleCase(x.name))}" loading="lazy">` : 'صورة المنتج'}</div><div class="info"><div class="name">${esc(titleCase(x.name))}</div><div class="desc">${displayDescription}</div><div class="bottom"><div class="price ${isMultiPrice ? 'multiPrice' : ''}">${displayPrice}</div></div></div></div>`;
  }).join('');
}
function showPublic(){ document.body.classList.remove('adminMode'); }
function showAdmin(){ document.body.classList.add('adminMode'); loadAdmin(); }
function openLogin(){ document.getElementById('loginModal').classList.add('show'); setTimeout(() => { document.getElementById('loginEmail').focus(); },100); }
function closeLogin(){ document.getElementById('loginModal').classList.remove('show'); document.getElementById('loginError').textContent = ''; }
async function login(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errorBox = document.getElementById('loginError');
  if(errorBox) errorBox.textContent = '';
  if(!email || !password){ if(errorBox) errorBox.textContent = 'اكتب البريد الإلكتروني وكلمة المرور.'; return; }
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ if(errorBox) errorBox.textContent = 'بيانات الدخول غير صحيحة.'; return; }
  if(data?.user){ closeLogin(); showAdmin(); }
}
async function logout(){ await sb.auth.signOut(); showPublic(); }
async function loadAdmin(){
  const list = document.getElementById('adminList');
  if(list) list.innerHTML = `<div class="loading">Loading...</div>`;
  const { data, error } = await sb.from('products').select('*').order('created_at',{ ascending:false });
  if(error){ if(list) list.innerHTML = `<div class="empty">حصل خطأ أثناء تحميل الأصناف.</div>`; return; }
  const allProducts = data || [];
  if(!list) return;
  if(!allProducts.length){ list.innerHTML = `<div class="empty">لا توجد أصناف حتى الآن.</div>`; return; }
  list.innerHTML = allProducts.map(x => `<div class="adminItem"><div class="adminItemInfo"><div class="adminItemName">${esc(titleCase(x.name))}</div><div class="adminItemMeta">${esc(x.category)} — ${Number(x.price).toLocaleString('en-US')} EGP — ${x.available ? 'متاح' : 'مخفي'}</div></div><div class="adminItemActions"><button class="smallBtn ${x.available ? 'active' : ''}" onclick="toggleAvailability(${x.id},${x.available})">${x.available ? 'إخفاء' : 'إظهار'}</button><button class="smallBtn" onclick="editProduct(${x.id})">تعديل</button><button class="smallBtn" onclick="deleteProduct(${x.id})">حذف</button></div></div>`).join('');
}
function setupAdminCategorySelect(){
  const select = document.getElementById('category');
  if(select) select.innerHTML = cats.map(c => `<option value="${esc(c.db)}">${esc(titleCase(c.name))}</option>`).join('');
}
function clearForm(){
  document.getElementById('editId').value = ''; document.getElementById('name').value = '';
  document.getElementById('description').value = ''; document.getElementById('price').value = '';
  document.getElementById('image').value = ''; document.getElementById('category').value = cats.db;
}
async function editProduct(id){
  const { data, error } = await sb.from('products').select('*').eq('id',id).single();
  if(error){ alert('حصل خطأ أثناء تحميل الصنف.'); return; }
  document.getElementById('editId').value = data.id; document.getElementById('name').value = data.name || '';
  document.getElementById('description').value = data.description || ''; document.getElementById('category').value = data.category;
  document.getElementById('price').value = data.price; document.getElementById('image').value = '';
  window.scrollTo({ top:0, behavior:'smooth' });
}
async function saveProduct(){
  const editId = document.getElementById('editId').value; const name = document.getElementById('name').value.trim();
  const description = document.getElementById('description').value.trim(); const category = document.getElementById('category').value;
  const price = Number(document.getElementById('price').value); const imageFile = document.getElementById('image').files[0];
  if(!name){ alert('اكتب اسم الصنف.'); return; } if(!category){ alert('اختار القسم.'); return; } if(Number.isNaN(price)){ alert('اكتب السعر.'); return; }
  let imageUrl = null;
  if(editId){
    const { data:oldProduct, error:oldError } = await sb.from('products').select('*').eq('id',editId).single();
    if(oldError){ alert('حصل خطأ.'); return; } imageUrl = oldProduct.image_url || null;
    if(imageFile){
      const fileExt = imageFile.name.split('.').pop().toLowerCase(); const fileName = `${Date.now()}.${fileExt}`;
      const { error:uploadError } = await sb.storage.from('product-images').upload(fileName, imageFile, { upsert:false });
      if(uploadError){ alert('خطأ في رفع الصورة.'); return; }
      imageUrl = sb.storage.from('product-images').getPublicUrl(fileName).data.publicUrl;
    }
    await sb.from('products').update({ name, description, category, price, image_url:imageUrl }).eq('id',editId);
    alert('تم التعديل بنجاح! حمل ملف JSON الجديد وضعه في جيتهب لتحديث منيو الزباين.');
  } else {
    if(imageFile){
      const fileExt = imageFile.name.split('.').pop().toLowerCase(); const fileName = `${Date.now()}.${fileExt}`;
      const { error:uploadError } = await sb.storage.from('product-images').upload(fileName, imageFile, { upsert:false });
      if(uploadError){ alert('خطأ في رفع الصورة.'); return; }
      imageUrl = sb.storage.from('product-images').getPublicUrl(fileName).data.publicUrl;
    }
    await sb.from('products').insert({ name, description, category, price, image_url:imageUrl, available:true });
    alert('تمت الإضافة بنجاح! ارفع الـ JSON الجديد في جيتهب لتحديث منيو الزباين.');
  }
  clearForm(); await loadAdmin(); await loadPublic();
}
async function toggleAvailability(id, current){ await sb.from('products').update({ available:!current }).eq('id',id); await loadAdmin(); await loadPublic(); }
async function deleteProduct(id){ if(!confirm('هل أنت متأكد؟')) return; await sb.from('products').delete().eq('id',id); alert('تم الحذف بنجاح!'); await loadAdmin(); await loadPublic(); }
function isAdminUrl(){ return new URLSearchParams(window.location.search).get('admin') === '1'; }
sb.auth.onAuthStateChange(async (event,session) => { if(event === 'SIGNED_OUT'){ showPublic(); return; } if((event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && session?.user && isAdminUrl()){ showAdmin(); } });
setupAdminCategorySelect(); showPublic(); loadPublic();
document.addEventListener('keydown', event => { if(event.ctrlKey && event.shiftKey && event.key.toLowerCase() === 'a'){ event.preventDefault(); openLogin(); } });
if(isAdminUrl()){ openLogin(); }
</script>
</body>
</html>
