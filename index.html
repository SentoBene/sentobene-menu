<!doctype html>
<html lang="en" dir="ltr">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>SentoBene | Menu</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
  --bg:#090b0a;
  --card:#111413;
  --gold:#d7a33a;
  --gold2:#f0c15d;
  --text:#f7f3eb;
  --muted:#aaa49b;
  --line:#302b23;
  --danger:#b94b4b;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Times New Roman",Times,serif;
  direction:ltr;
}

body{
  min-height:100vh;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
}


/* =========================
   HEADER
========================= */

.header{
  width:100%;
  max-width:1100px;
  margin:0 auto;
  padding:20px 16px 8px;
  text-align:center;
}

.logo{
  display:block;
  width:min(220px,72vw);
  max-height:130px;
  object-fit:contain;
  margin:0 auto;
}

.tag{
  min-height:4px;
}


/* =========================
   SOCIAL
========================= */

.social{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  margin-top:9px;
  direction:ltr;
}

.social a{
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--gold2);
  text-decoration:none;
  border:1px solid #3a352d;
  border-radius:50%;
  background:#111413;
  transition:.2s ease;
}

.social a:hover{
  background:var(--gold);
  color:#111;
  border-color:var(--gold);
}

.social svg{
  width:17px;
  height:17px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.social a:last-child svg{
  fill:currentColor;
  stroke:none;
}

.socialName{
  font-family:"Times New Roman",Times,serif;
  font-size:16px;
  font-weight:700;
  color:var(--gold2);
  letter-spacing:.3px;
  text-transform:capitalize;
}


/* =========================
   MAIN
========================= */

.public{
  width:min(1100px,100%);
  margin:0 auto;
  padding:0 14px 30px;
  direction:ltr;
}

.hero{
  text-align:center;
  padding:5px 0 8px;
  direction:ltr;
}

.hero h1{
  margin:0;
  font-family:"Times New Roman",Times,serif;
  font-size:30px;
  font-weight:700;
  text-transform:capitalize;
}

.hero p{
  margin:6px 0 0;
  color:var(--muted);
  font-size:14px;
}


/* =========================
   CATEGORIES
========================= */

.cats{
  display:flex;
  flex-wrap:nowrap;
  align-items:center;
  gap:8px;
  width:100%;
  overflow-x:auto;
  overflow-y:hidden;

  padding:15px 2px 14px;

  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;

  direction:ltr;
  white-space:nowrap;
  scroll-behavior:smooth;
}

.cats::-webkit-scrollbar{
  display:none;
}

.cats button{
  flex:0 0 auto;
  direction:ltr;
  white-space:nowrap;

  border:1px solid #3a352d;
  background:#111413;
  color:#ddd;

  border-radius:999px;
  padding:9px 14px;

  font-family:"Times New Roman",Times,serif;
  font-weight:700;
  font-size:15px;
  line-height:1.2;

  text-transform:capitalize;

  cursor:pointer;
  transition:.2s ease;
}

.cats button:hover{
  border-color:var(--gold);
}

.cats button.active{
  background:var(--gold);
  border-color:var(--gold);
  color:#111;
  font-weight:800;
}


/* =========================
   SECTION TITLE
========================= */

.sectionTitle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;

  margin:5px 0 14px;
  padding-bottom:9px;

  border-bottom:1px solid var(--line);

  direction:ltr;
}

.sectionTitle h2{
  margin:0;

  font-family:"Times New Roman",Times,serif;
  font-weight:700;
  font-size:21px;
  line-height:1.2;

  text-transform:capitalize;
}

.sectionTitle span{
  font-size:11px;
  color:var(--muted);
  font-family:"Times New Roman",Times,serif;
}


/* =========================
   PRODUCTS GRID
========================= */

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
  direction:ltr;
}

.card{
  overflow:hidden;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:0 8px 25px rgba(0,0,0,.16);

  direction:ltr;
}

.photo{
  width:100%;
  aspect-ratio:1.55;

  background:radial-gradient(
    circle at 50% 40%,
    #30281c,
    #171a18 70%
  );

  display:flex;
  align-items:center;
  justify-content:center;

  color:#8e806a;
  text-align:center;

  padding:12px;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:8px;
  display:block;
}

.info{
  padding:12px 13px 13px;
  direction:ltr;
  text-align:left;
}

.name{
  font-family:"Times New Roman",Times,serif;
  font-weight:700;
  font-size:17px;
  line-height:1.3;

  text-transform:capitalize;

  color:var(--text);
}

.desc{
  font-family:"Times New Roman",Times,serif;
  font-size:12px;
  color:var(--muted);
  line-height:1.55;

  margin:5px 0 10px;
  min-height:34px;
}

.bottom{
  display:flex;
  align-items:center;
  justify-content:flex-start;
}

.price{
  color:var(--gold2);

  font-family:"Times New Roman",Times,serif;
  font-weight:900;
  font-size:17px;
  line-height:1.2;

  white-space:nowrap;
  text-transform:none;
}


/* =========================
   EMPTY
========================= */

.empty{
  padding:35px 15px;
  text-align:center;
  color:var(--muted);
  border:1px dashed var(--line);
  border-radius:14px;
}


/* =========================
   FOOTER
========================= */

.footer{
  text-align:center;
  color:#777;
  font-size:11px;
  padding:25px 10px 35px;
}


/* =========================
   ADMIN
========================= */

.admin{
  display:none;
  width:min(1100px,100%);
  margin:0 auto;
  padding:20px 14px 40px;
  direction:rtl;
}

.admin.show{
  display:block;
}

.adminHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;

  margin-bottom:20px;
}

.adminHead h2{
  margin:0;
  font-family:"Times New Roman",Times,serif;
  font-size:24px;
}

.adminActions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.btn{
  border:1px solid var(--line);
  background:#151816;
  color:#eee;
  border-radius:9px;
  padding:9px 13px;
  font-weight:700;
}

.btn:hover{
  border-color:var(--gold);
}

.btn.gold{
  background:var(--gold);
  border-color:var(--gold);
  color:#111;
}

.btn.danger{
  background:#351919;
  border-color:#5c2828;
  color:#f1caca;
}

.adminGrid{
  display:grid;
  grid-template-columns:360px minmax(0,1fr);
  gap:18px;
}

.panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:15px;
}

.panel h3{
  margin:0 0 14px;
  font-size:18px;
  font-family:"Times New Roman",Times,serif;
}

.formGroup{
  margin-bottom:12px;
}

.formGroup label{
  display:block;
  margin-bottom:5px;
  color:#ddd;
  font-size:13px;
  font-weight:700;
}

.formGroup input,
.formGroup textarea,
.formGroup select{
  width:100%;
  border:1px solid #3a352d;
  background:#0c0f0e;
  color:#fff;
  border-radius:9px;
  padding:10px 11px;
  outline:none;
}

.formGroup input:focus,
.formGroup textarea:focus,
.formGroup select:focus{
  border-color:var(--gold);
}

.formGroup textarea{
  min-height:90px;
  resize:vertical;
}

.formRow{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.formButtons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:14px;
}

.adminList{
  display:grid;
  gap:10px;
}

.adminItem{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;

  padding:10px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#0c0f0e;
}

.adminItemInfo{
  min-width:0;
}

.adminItemName{
  font-family:"Times New Roman",Times,serif;
  font-weight:700;
  font-size:16px;
  text-transform:capitalize;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.adminItemMeta{
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

.adminItemActions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.smallBtn{
  border:1px solid #3a352d;
  background:#151816;
  color:#ddd;
  border-radius:7px;
  padding:6px 9px;
  font-size:11px;
  font-weight:700;
}

.smallBtn:hover{
  border-color:var(--gold);
}

.smallBtn.active{
  background:var(--gold);
  border-color:var(--gold);
  color:#111;
}


/* =========================
   LOGIN MODAL
========================= */

.modal{
  position:fixed;
  inset:0;

  display:none;
  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.78);
  padding:20px;

  z-index:9999;
}

.modal.show{
  display:flex;
}

.modalBox{
  width:min(400px,100%);

  background:#111413;
  border:1px solid var(--line);
  border-radius:15px;

  padding:20px;

  box-shadow:0 20px 70px rgba(0,0,0,.5);
}

.modalBox h2{
  margin:0 0 16px;
  text-align:center;

  font-family:"Times New Roman",Times,serif;
}

.modalButtons{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.modalButtons button{
  flex:1;
}

.loginError{
  color:#ef8d8d;
  font-size:12px;
  min-height:18px;
  margin-top:7px;
}


/* =========================
   LOADING
========================= */

.loading{
  text-align:center;
  color:var(--muted);
  padding:30px 10px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .header{
    padding-top:15px;
  }

  .logo{
    width:min(190px,70vw);
    max-height:110px;
  }

  .public{
    padding-left:10px;
    padding-right:10px;
  }

  /* صنفين جنب بعض على الموبايل */
  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
  }

  .photo{
    aspect-ratio:1.25;
  }

  .info{
    padding:10px;
  }

  .name{
    font-size:16px;
  }

  .price{
    font-size:16px;
  }

  .adminGrid{
    grid-template-columns:1fr;
  }

  .adminHead{
    align-items:flex-start;
    flex-direction:column;
  }

}

@media(max-width:430px){

  .name{
    font-size:15px;
  }

  .price{
    font-size:15px;
  }

  .cats button{
    font-size:14px;
    padding:8px 13px;
  }

}


/* =========================
   PUBLIC / ADMIN SWITCH
========================= */

body.adminMode .public{
  display:none;
}

body.adminMode .admin{
  display:block;
}

body.adminMode .footer{
  display:none;
}

</style>
</head>

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  'https://xzyobcexywacsjlatntx.supabase.co';

const SUPABASE_ANON_KEY =
  'PASTE_YOUR_EXISTING_ANON_KEY_HERE';

/*
  مهم:
  لو عندك ANON KEY حقيقي في نسختك الحالية،
  خليه مكان السطر اللي فوق.
*/

const sb =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================================
   CATEGORIES
========================================= */

const cats = [

  {
    db:'PASTA',
    name:'Pasta'
  },

  {
    db:'SANDWICHES',
    name:'Sandwiches'
  },

  {
    db:'PORIZZA',
    name:'Purezza'
  },

  {
    db:'MAIN COURSE',
    name:'Main Course'
  },

  {
    db:'SIDE ITEM',
    name:'Side Items'
  },

  {
    db:'DESSERTS',
    name:'Desserts'
  },

  {
    db:'SPECIAL MOCKTAILS',
    name:'Special Mocktails'
  },

  {
    db:'HOT DRINKS',
    name:'Hot Drinks'
  },

  {
    db:'FRESH JUICE',
    name:'Fresh Juices'
  },

  {
    db:'MILK SHAKE',
    name:'Milkshakes'
  },

  {
    db:'ICED DRINKS',
    name:'Iced Drinks'
  }

];


/* =========================================
   STATE
========================================= */

let products = [];

let active = cats[0].db;


/* =========================================
   HELPERS
========================================= */

function esc(value){

  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


/*
  English text:
  First Letter Capital
  باقي الحروف Small
*/

function titleCase(text){

  return String(text || '')
    .toLowerCase()
    .replace(/\b\w/g, char =>
      char.toUpperCase()
    );

}


/* =========================================
   CATEGORY BAR
========================================= */

function setupCats(){

  const container =
    document.getElementById('cats');

  container.innerHTML =
    cats.map(c => `

      <button
        class="${c.db === active ? 'active' : ''}"
        onclick="selectCategory('${c.db}')"
      >
        ${esc(titleCase(c.name))}
      </button>

    `).join('');

}


function selectCategory(category){

  active = category;

  renderPublic();

}


/* =========================================
   LOAD PUBLIC PRODUCTS
========================================= */

async function loadPublic(){

  const container =
    document.getElementById('products');

  container.innerHTML = `
    <div class="loading">
      Loading...
    </div>
  `;

  const {
    data,
    error
  } = await sb
    .from('products')
    .select('*')
    .eq('available',true)
    .order('created_at',{
      ascending:false
    });

  if(error){

    console.error(error);

    container.innerHTML = `
      <div class="empty">
        حصل خطأ أثناء تحميل المينيو.
      </div>
    `;

    return;
  }

  products = data || [];

  renderPublic();

}


/* =========================================
   RENDER PUBLIC
========================================= */

function renderPublic(){

  setupCats();


  const sectionProducts =
    products.filter(
      x => x.category === active
    );


  const currentCat =
    cats.find(
      c => c.db === active
    );


  document.getElementById(
    'sectionName'
  ).textContent =
    currentCat
      ? titleCase(currentCat.name)
      : titleCase(active);


  document.getElementById(
    'count'
  ).textContent =
    `${sectionProducts.length} ${
      sectionProducts.length === 1
        ? 'Item'
        : 'Items'
    }`;


  const container =
    document.getElementById('products');


  if(!sectionProducts.length){

    container.innerHTML = `
      <div class="empty">
        لا توجد أصناف متاحة في هذا القسم حاليًا.
      </div>
    `;

    return;
  }


  container.innerHTML =
    sectionProducts.map(x => `

      <div class="card">

        <div class="photo">

          ${
            x.image_url
              ? `

                <img
                  src="${esc(x.image_url)}"
                  alt="${esc(titleCase(x.name))}"
                  loading="lazy"
                >

              `
              : 'صورة المنتج'
          }

        </div>


        <div class="info">

          <div class="name">
            ${esc(titleCase(x.name))}
          </div>


          <div class="desc">
            ${esc(x.description || '')}
          </div>


          <div class="bottom">

            <div class="price">
              ${Number(x.price).toLocaleString('en-US')} EGP
            </div>

          </div>

        </div>

      </div>

    `).join('');

}


/* =========================================
   ADMIN - SHOW / HIDE
========================================= */

function showPublic(){

  document.body.classList.remove(
    'adminMode'
  );

}


function showAdmin(){

  document.body.classList.add(
    'adminMode'
  );

  loadAdmin();

}


/* =========================================
   LOGIN
========================================= */

function openLogin(){

  document.getElementById(
    'loginModal'
  ).classList.add('show');

  setTimeout(() => {

    document.getElementById(
      'loginEmail'
    ).focus();

  },100);

}


function closeLogin(){

  document.getElementById(
    'loginModal'
  ).classList.remove('show');

  document.getElementById(
    'loginError'
  ).textContent = '';

}


async function login(){

  const email =
    document.getElementById(
      'loginEmail'
    ).value.trim();


  const password =
    document.getElementById(
      'loginPassword'
    ).value;


  const errorBox =
    document.getElementById(
      'loginError'
    );


  errorBox.textContent = '';


  if(!email || !password){

    errorBox.textContent =
      'اكتب البريد الإلكتروني وكلمة المرور.';

    return;
  }


  const {
    data,
    error
  } = await sb.auth.signInWithPassword({

    email,
    password

  });


  if(error){

    console.error(error);

    errorBox.textContent =
      'بيانات الدخول غير صحيحة.';

    return;
  }


  if(data?.user){

    closeLogin();

    showAdmin();

  }

}


/* =========================================
   LOGOUT
========================================= */

async function logout(){

  await sb.auth.signOut();

  showPublic();

}


/* =========================================
   ADMIN LOAD
========================================= */

async function loadAdmin(){

  const list =
    document.getElementById(
      'adminList'
    );


  list.innerHTML = `
    <div class="loading">
      Loading...
    </div>
  `;


  const {
    data,
    error
  } = await sb
    .from('products')
    .select('*')
    .order('created_at',{
      ascending:false
    });


  if(error){

    console.error(error);

    list.innerHTML = `
      <div class="empty">
        حصل خطأ أثناء تحميل الأصناف.
      </div>
    `;

    return;
  }


  const allProducts =
    data || [];


  if(!allProducts.length){

    list.innerHTML = `
      <div class="empty">
        لا توجد أصناف حتى الآن.
      </div>
    `;

    return;
  }


  list.innerHTML =
    allProducts.map(x => `

      <div class="adminItem">

        <div class="adminItemInfo">

          <div class="adminItemName">
            ${esc(titleCase(x.name))}
          </div>

          <div class="adminItemMeta">
            ${esc(x.category)}
            —
            ${Number(x.price).toLocaleString('en-US')} EGP
            —
            ${x.available ? 'متاح' : 'مخفي'}
          </div>

        </div>


        <div class="adminItemActions">

          <button
            class="smallBtn ${x.available ? 'active' : ''}"
            onclick="toggleAvailability(${x.id},${x.available})"
          >
            ${x.available ? 'إخفاء' : 'إظهار'}
          </button>


          <button
            class="smallBtn"
            onclick="editProduct(${x.id})"
          >
            تعديل
          </button>


          <button
            class="smallBtn"
            onclick="deleteProduct(${x.id})"
          >
            حذف
          </button>

        </div>

      </div>

    `).join('');

}

   CATEGORY SELECT
========================================= */

function setupAdminCategorySelect(){

  select.innerHTML =

/* =========================================
   CLEAR FORM
========================================= */

function clearForm(){

  document.getElementById(
    'editId'
  ).value = '';


  document.getElementById(
    'name'
  ).value = '';


  document.getElementById(
    'description'
  ).value = '';


  document.getElementById(
    'price'
  ).value = '';


  document.getElementById(
    'image'
  ).value = '';


  document.getElementById(
    'category'
  ).value = cats[0].db;

}


/* =========================================
   EDIT PRODUCT
========================================= */

async function editProduct(id){

  const {
    data,
    error
  } = await sb
    .from('products')
    .select('*')
    .eq('id',id)
    .single();


  if(error){

    alert(
      'حصل خطأ أثناء تحميل الصنف.'
    );

    return;
  }


  document.getElementById(
    'editId'
  ).value = data.id;


  document.getElementById(
    'name'
  ).value = data.name || '';


  document.getElementById(
    'description'
  ).value = data.description || '';


  document.getElementById(
    'category'
  ).value = data.category;


  document.getElementById(
    'price'
  ).value = data.price;


  document.getElementById(
    'image'
  ).value = '';


  window.scrollTo({
    top:0,
    behavior:'smooth'
  });

}


/* =========================================
   SAVE PRODUCT
========================================= */

async function saveProduct(){

  const editId =
    document.getElementById(
      'editId'
    ).value;


  const name =
    document.getElementById(
      'name'
    ).value.trim();


  const description =
    document.getElementById(
      'description'
    ).value.trim();


  const category =
    document.getElementById(
      'category'
    ).value;


  const price =
    Number(
      document.getElementById(
        'price'
      ).value
    );


  const imageFile =
    document.getElementById(
      'image'
    ).files[0];


  if(!name){

    alert(
      'اكتب اسم الصنف.'
    );

    return;
  }


  if(!category){

    alert(
      'اختار القسم.'
    );

    return;
  }


  if(Number.isNaN(price)){

    alert(
      'اكتب السعر.'
    );

    return;
  }


  let imageUrl = null;


  /* =========================
     EDIT EXISTING PRODUCT
  ========================= */

  if(editId){

    const {
      data:oldProduct,
      error:oldError
    } = await sb
      .from('products')
      .select('*')
      .eq('id',editId)
      .single();


    if(oldError){

      alert(
        'حصل خطأ أثناء تحميل الصنف.'
      );

      return;
    }


    imageUrl =
      oldProduct.image_url || null;


    /* =========================
       UPLOAD NEW IMAGE
    ========================= */

    if(imageFile){

      const fileExt =
        imageFile.name
          .split('.')
          .pop()
          .toLowerCase();


      const fileName =
        `${Date.now()}-${Math.random()
          .toString(36)
          .slice(2)}.${fileExt}`;


      const {
        error:uploadError
      } = await sb.storage
        .from('product-images')
        .upload(
          fileName,
          imageFile,
          {
            upsert:false
          }
        );


      if(uploadError){

        console.error(uploadError);

        alert(
          'حصل خطأ أثناء رفع الصورة.'
        );

        return;
      }


      const {
        data:publicData
      } = sb.storage
        .from('product-images')
        .getPublicUrl(fileName);


      imageUrl =
        publicData.publicUrl;

    }


    const {
      error:updateError
    } = await sb
      .from('products')
      .update({

        name,
        description,
        category,
        price,
        image_url:imageUrl

      })
      .eq('id',editId);


    if(updateError){

      console.error(updateError);

      alert(
        'حصل خطأ أثناء حفظ التعديل.'
      );

      return;
    }


    alert(
      'تم تعديل الصنف بنجاح.'
    );

  }


  /* =========================
     ADD NEW PRODUCT
  ========================= */

  else{

    if(imageFile){

      const fileExt =
        imageFile.name
          .split('.')
          .pop()
          .toLowerCase();


      const fileName =
        `${Date.now()}-${Math.random()
          .toString(36)
          .slice(2)}.${fileExt}`;


      const {
        error:uploadError
      } = await sb.storage
        .from('product-images')
        .upload(
          fileName,
          imageFile,
          {
            upsert:false
          }
        );


      if(uploadError){

        console.error(uploadError);

        alert(
          'حصل خطأ أثناء رفع الصورة.'
        );

        return;
      }


      const {
        data:publicData
      } = sb.storage
        .from('product-images')
        .getPublicUrl(fileName);


      imageUrl =
        publicData.publicUrl;

    }


    const {
      error:insertError
    } = await sb
      .from('products')
      .insert({

        name,
        description,
        category,
        price,
        image_url:imageUrl,
        available:true

      });


    if(insertError){

      console.error(insertError);

      alert(
        'حصل خطأ أثناء إضافة الصنف.'
      );

      return;
    }


    alert(
      'تم إضافة الصنف بنجاح.'
    );

  }


  clearForm();

  await loadAdmin();

  await loadPublic();

}


/* =========================================
   TOGGLE AVAILABILITY
========================================= */

async function toggleAvailability(
  id,
  current
){

  const {
    error
  } = await sb
    .from('products')
    .update({

      available:!current

    })
    .eq('id',id);


  if(error){

    console.error(error);

    alert(
      'حصل خطأ أثناء تغيير حالة الصنف.'
    );

    return;
  }


  await loadAdmin();

  await loadPublic();

}


/* =========================================
   DELETE PRODUCT
========================================= */

async function deleteProduct(id){

  const confirmed =
    confirm(
      'هل أنت متأكد من حذف هذا الصنف؟'
    );


  if(!confirmed){
    return;
  }


  const {
    error
  } = await sb
    .from('products')
    .delete()
    .eq('id',id);


  if(error){

    console.error(error);

    alert(
      'حصل خطأ أثناء حذف الصنف.'
    );

    return;
  }


  alert(
    'تم حذف الصنف.'
  );


  await loadAdmin();

  await loadPublic();

}

/* =========================================
   AUTH STATE
========================================= */

sb.auth.onAuthStateChange(
  async (event,session) => {

    if(
      event === 'SIGNED_IN' &&
      session?.user
    ){

      showAdmin();

    }


    if(
      event === 'SIGNED_OUT'
    ){

      showPublic();

    }

  }
);

========================================= */

  'keydown',
  event => {

    if(
      event.ctrlKey &&
      event.shiftKey &&
      event.key.toLowerCase() === 'a'
    ){

      event.preventDefault();

      openLogin();

    }

  }
);
