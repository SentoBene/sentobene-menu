<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SentoBene | Menu</title>
<style>
:root{--bg:#090b0a;--card:#111413;--gold:#d7a33a;--gold2:#f0c15d;--text:#f7f3eb;--muted:#aaa49b;--line:#302b23;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:"Times New Roman",Times,serif;direction:ltr;}
body{min-height:100vh;}
button{cursor:pointer;font:inherit;}
.header{width:100%;max-width:1100px;margin:0 auto;padding:20px 16px 8px;text-align:center;}
.logo{display:block;width:min(220px,72vw);max-height:130px;object-fit:contain;margin:0 auto;}
.social{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:9px;direction:ltr;}
.social a{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--gold2);text-decoration:none;border:1px solid #3a352d;border-radius:50%;background:#111413;}
.socialName{font-family:"Times New Roman",Times,serif;font-size:16px;font-weight:700;color:var(--gold2);letter-spacing:.3px;}
.public{width:min(1100px,100%);margin:0 auto;padding:0 14px 30px;}
.cats{display:flex;flex-wrap:nowrap;align-items:center;gap:8px;width:100%;overflow-x:auto;padding:15px 2px 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch;white-space:nowrap;}
.cats button{flex:0 0 auto;border:1px solid #3a352d;background:#111413;color:#ddd;border-radius:999px;padding:9px 14px;font-weight:700;font-size:15px;}
.cats button.active{background:var(--gold);border-color:var(--gold);color:#111;font-weight:800;}
.sectionTitle{display:flex;align-items:center;justify-content:space-between;margin:5px 0 14px;padding-bottom:9px;border-bottom:1px solid var(--line);}
.sectionTitle h2{margin:0;font-weight:700;font-size:21px;}
.sectionTitle span{font-size:11px;color:var(--muted);}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
.card{overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 25px rgba(0,0,0,.16);}
.photo{width:100%;aspect-ratio:1.55;background:radial-gradient(circle at 50% 40%,#30281c,#171a18 70%);display:flex;align-items:center;justify-content:center;color:#8e806a;}
.photo img{width:100%;height:100%;object-fit:cover;border-radius:8px;}
.info{padding:12px 13px 13px;}
.name{font-weight:700;font-size:17px;line-height:1.3;}
.desc{font-size:12px;color:var(--muted);margin:5px 0 10px;min-height:34px;}
.price{color:var(--gold2);font-weight:900;font-size:17px;}
.price.multiPrice{white-space:normal;line-height:1.4;font-size:15px;}
.footer{text-align:center;color:#777;font-size:11px;padding:25px 10px 35px;}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}.photo{aspect-ratio:1.25;}}
</style>
</head>
<body>
<div class="public">
  <header class="header">
    <img class="logo" src="ChatGPT Image Sep 1, 2026, 08_20_26 PM.png" alt="SentoBene">
    <div class="social"><span class="socialName">SentoBene Menu</span></div>
  </header>
  <div id="cats" class="cats"></div>
  <section class="sectionTitle"><h2 id="sectionName">Pasta</h2><span id="count">0 Items</span></section>
  <main id="products" class="grid"></main>
  <footer class="footer">SentoBene®</footer>
</div>
<script>
const cats = [
  { db:'PASTA', name:'Pasta' }, { db:'SANDWICHES', name:'Sandwiches' },
  { db:'PORIZZA', name:'Purezza' }, { db:'MAIN COURSE', name:'Main Course' }
];
// الأكلات والأسعار بتاعتك مدمجة ومحفوظة هنا ومفيش أي استهلاك للباقة
const products = [
  { name: 'Arabiata', price: 94, category: 'PASTA', description: 'بلح الزيتون والفلفل الأخضر الحار وصوص النابوليتان', available: true },
  { name: 'Bolognese', price: 169, category: 'PASTA', description: 'مكرونة إسباجيتي مع صوص البولونيز المميز', available: true },
  { name: 'Pesto', price: 175, category: 'PASTA', description: 'الكريمة بصوص البيستو وصدور الدجاج المتبل والمشروم', available: true },
  { name: 'Alfredo', price: 170, category: 'PASTA', description: 'الدجاج المتبل والمشروم مع صوص الألفريدو المميز', available: true },
  { name: 'Tuna', price: 265, category: 'PASTA', description: 'فلفل الألوان وشرائح البصل مع صوص الدايودان المميز', available: true },
  { name: 'Shrimp', price: 275, category: 'PASTA', description: 'الجمبري وشرائح الزيتون والشبت مع الصوص الأبيض المميز', available: true },
  { name: 'Negresco', price: 196, category: 'PASTA', description: 'الدجاج المتبل والصوص الأبيض المميز والجبنة الموتزاريلا', available: true },
  { name: 'Meatballs', price: 167, category: 'PASTA', description: 'كرات اللحم والصوص الأبيض والبيستو المميز والجبنة الموتزاريلا', available: true },
  { name: 'Chicken Supreme', price: 186, category: 'PASTA', description: 'قطع الدجاج مع البسطرمة الطازجة وفلفل الألوان وصوص الألفريدو', available: true },
  { name: 'Mac & Cheese', price: 189, category: 'PASTA', description: 'مكرونة ريجاتوني مع خليط من أجود أنواع الجبن', available: true },
  { name: 'Mix Beef Oven', price: 198, category: 'PASTA', description: 'قطع لحم البقر مع فلفل الألوان والموتزاريلا في الفرن', available: true },
  { name: 'Beef Cheese Steak', price: 194, category: 'PASTA', description: 'شرائح لحم ستيك بصوص الاستياك الخاص مع خليط من الجبن', available: true }
];
let active = cats[0].db;
function setupCats(){
  document.getElementById('cats').innerHTML = cats.map(c => `
    <button class="${c.db === active ? 'active' : ''}" onclick="selectCategory('${c.db}')">${c.name}</button>
  `).join('');
}
function selectCategory(category){ active = category; renderMenu(); }
function renderMenu(){
  setupCats();
  let filtered = products.filter(x => x.category === active);
  document.getElementById('sectionName').textContent = active;
  document.getElementById('count').textContent = `${filtered.length} Items`;
  const container = document.getElementById('products');
  if(!filtered.length){ container.innerHTML = `<div class="empty">قريباً.. أصناف جديدة</div>`; return; }
  container.innerHTML = filtered.map(x => `
    <div class="card">
      <div class="info">
        <div class="name">${x.name}</div>
        <div class="desc">${x.description || ''}</div>
        <div class="price">EGP ${x.price}</div>
      </div>
    </div>
  `).join('');
}
document.addEventListener('DOMContentLoaded', renderMenu);
</script>
</body>
</html>
