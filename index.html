<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>SentoBene | Menu</title>
    <!-- استدعاء خط عربي مميز للعناوين من جوجل -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
    
    <script src="https://jsdelivr.net"></script>
    <style>
        :root{--bg:#090b0a;--card:#111413;--gold:#d7a33a;--gold2:#f0c15d;--text:#f7f3eb;--muted:#aaa49b;--line:#302b23;--danger:#b94b4b}
        *{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Tahoma,sans-serif}body{min-height:100vh}button,input,textarea,select{font:inherit}
        .header{position:sticky;top:0;z-index:50;background:rgba(9,11,10,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:15px 16px 12px;text-align:center}.logo{width:118px;display:block;margin:auto;mix-blend-mode:screen}.tag{color:var(--gold2);font-size:11px;margin-top:5px}
        .wrap{max-width:920px;margin:auto;padding:14px 14px 34px}.hero{border:1px solid #403521;border-radius:20px;overflow:hidden;background:linear-gradient(120deg,#101210,#241b0e);padding:22px 20px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
        
        /* تعديل الخط هنا ليدعم العربية بشكل فاخر */
        .hero h1{font:800 26px 'Cairo', serif;margin:0 0 7px;color:var(--text)}
        .hero p{margin:0;color:#d5c5a7;font-size:12px}.hero .mark{font-size:34px;color:var(--gold)}
        .cats{display:flex;gap:8px;overflow-x:auto;padding:2px 1px 14px;scrollbar-width:none;direction:ltr}.cats::-webkit-scrollbar{display:none}
        .cats button{direction:rtl;white-space:nowrap;border:1px solid #3a352d;background:#111413;color:#ddd;border-radius:999px;padding:9px 14px;font-family:'Cairo', sans-serif;font-weight:600;cursor:pointer}
        .cats button.active{background:var(--gold);border-color:var(--gold);color:#111;font-weight:800}
        .sectionTitle{display:flex;justify-content:space-between;align-items:end;margin:5px 0 12px}
        .sectionTitle h2{margin:0;font-family:'Cairo', sans-serif;font-weight:700;font-size:21px}
        .sectionTitle span{font-size:11px;color:var(--muted)}
        
        /* إكمال الجزء المقطوع وتنسيق شبكة المنتجات */
        .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
        .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
        .card img{width:100%;height:120px;object-fit:cover;border-radius:8px}
        .card-title{font-size:16px;font-weight:bold;margin:0}
        .card-price{color:var(--gold2);font-weight:bold;font-size:14px}
    </style>
</head>
<body>

    <div class="header">
        <div class="logo"><h2 style="margin:0; color:var(--gold)">SentoBene</h2></div>
        <div class="tag">المذاق الإيطالي الأصيل</div>
    </div>

    <div class="wrap">
        <div class="hero">
            <div>
                <h1>قائمة الطعام</h1>
                <p>استمتع بأشهى المأكولات المحضرة بحب</p>
            </div>
            <div class="mark">🍕</div>
        </div>

        <!-- التصنيفات -->
        <div class="cats">
            <button class="active">الكل</button>
            <button>بيتزا</button>
            <button>باستا</button>
            <button>مقبلات</button>
            <button>مشروبات</button>
        </div>

        <div class="sectionTitle">
            <h2>الأكثر مبيعاً</h2>
            <span>عرض الكل</span>
        </div>

        <!-- شبكة عرض الوجبات -->
        <div class="grid">
            <div class="card">
                <div class="card-title">بيتزا مارغريتا</div>
                <div class="card-price">120 ج.م</div>
            </div>
            <div class="card">
                <div class="card-title">باستا ألفريدو</div>
                <div class="card-price">150 ج.م</div>
            </div>
        </div>
    </div>

</body>
</html>
