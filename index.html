<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SentoBene | Menu</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#090b0a;
  --card:#111413;
  --gold:#d7a33a;
  --gold2:#f0c15d;
  --text:#f7f3eb;
  --muted:#aaa49b;
  --line:#302b23;
  --danger:#b94b4b;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Times New Roman",Times,serif;
  direction:ltr;
}

html[dir="rtl"] body{
  font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
}

body{
  min-height:100vh;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
}

.header{
  width:100%;
  max-width:1100px;
  margin:0 auto;
  padding:20px 16px 8px;
  text-align:center;
}

.logo{
  display:block;
  width:min(225px,76vw);
  max-height:135px;
  object-fit:contain;
  margin:0 auto;
}

.langBar{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
  margin-top:16px;
  direction:ltr;
}

.langBtn{
  background:#111413;
  border:1px solid #3a352d;
  color:var(--text);
  border-radius:999px;
  padding:6px 12px;
  font-size:13px;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  gap:6px;
  transition:all .2s ease;
}

.langBtn:hover{
  border-color:var(--gold);
  transform:translateY(-1px);
}

.langBtn.active{
  background:var(--gold);
  border-color:var(--gold);
  color:#111;
  box-shadow:0 3px 10px rgba(215,163,58,0.3);
}

.langBtn .fi{
  width:16px;
  height:16px;
  border-radius:50%;
  background-size:cover;
  display:inline-block;
  box-shadow:0 0 2px rgba(0,0,0,0.5);
}
.header .social{
  display: flex !important;
  flex-direction: column !important;
  align-items: center !important;
  gap: 10px !important;
  margin-top: 14px !important;
  width: 100% !important;
}

.header .socialIcons{
  display: flex !important;
  flex-direction: row !important;
  flex-wrap: nowrap !important;
  justify-content: center !important;
  align-items: center !important;
  gap: 16px !important;
  width: 100% !important;
  direction: ltr !important;
}

.header .socialIcons a{
  display: flex !important;
  width: 40px !important;
  height: 40px !important;
  flex: 0 0 40px !important;
  align-items: center !important;
  justify-content: center !important;
  text-decoration: none !important;
  border-radius: 50% !important;
  box-shadow: 0 3px 8px rgba(0,0,0,0.3) !important;
  transition: all .2s ease !important;
  animation: bubbleFloat 3s ease-in-out infinite !important;
}

.header .socialIcons a:nth-child(1) { 
  background: #E4405F !important;
  border: 1px solid #E4405F !important;
  color: #fff !important;
  animation-delay: 0s !important;
}
.header .socialIcons a:nth-child(2) { 
  background: #1877F2 !important;
  border: 1px solid #1877F2 !important;
  color: #fff !important;
  animation-delay: 0.4s !important; 
}
.header .socialIcons a:nth-child(3) { 
  background: #25D366 !important;
  border: 1px solid #25D366 !important;
  color: #fff !important;
  animation-delay: 0.8s !important; 
}
.header .socialIcons a:nth-child(4) { 
  background: #000000 !important;
  border: 1px solid #333333 !important;
  color: #fff !important;
  animation-delay: 1.2s !important; 
}

.header .socialIcons a:hover{
  animation-play-state: paused !important; 
  transform: scale(1.1) translateY(-2px) !important; 
  box-shadow: 0 5px 12px rgba(0,0,0,0.4) !important; 
  filter: brightness(1.1) !important; 
}

.header .socialIcons svg{
  width: 20px !important;        
  height: 20px !important;       
  min-width: 20px !important;
  min-height: 20px !important;
  fill: none !important;
  stroke: currentColor !important;
  stroke-width: 2 !important;    
  stroke-linecap: round !important;
  stroke-linejoin: round !important;
  display: block !important;
  margin: 0 auto !important;
}

.header .socialIcons a:nth-child(3) svg,
.header .socialIcons a:nth-child(4) svg{
  fill: currentColor !important;
  stroke: none !important;
}

.socialName{
  font-family: "Times New Roman",Times,serif;
  font-size: 16px;
  font-weight: 700;
  color: var(--gold2) !important;
  letter-spacing: .3px;
  display: block !important;
}

@keyframes bubbleFloat {
  0%, 100% {
    transform: scale(1);
    box-shadow: 0 3px 8px rgba(0,0,0,0.3);
  }
  50% {
    transform: scale(1.06); 
    box-shadow: 0 5px 12px rgba(0,0,0,0.4); 
  }
}

.public{
  width:min(1100px,100%);
  margin:0 auto;
  padding:0 14px 30px;
}

#cats.cats{
  display:flex !important;
  flex-direction:row !important;
  flex-wrap:nowrap !important;
  align-items:center;
  justify-content:flex-start;
  gap:8px;
  width:100%;
  max-width:100%;
  min-width:0;
  box-sizing:border-box;
  overflow-x:auto !important;
  overflow-y:hidden !important;
  padding:15px 2px 14px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-x:contain;
  white-space:nowrap;
  scroll-behavior:smooth;
}

#cats.cats::-webkit-scrollbar{
  display:none;
}

#cats.cats button{
  display:inline-flex;
  flex:0 0 auto !important;
  flex-shrink:0 !important;
  align-items:center;
  justify-content:center;
  white-space:nowrap;
  border:1px solid #3a352d;
  background:#111413;
  color:#ddd;
  border-radius:999px;
  padding:9px 14px;
  font-weight:700;
  font-size:15px;
  line-height:1.2;
  text-transform:capitalize;
  cursor:pointer;
  transition:.2s ease;
}

#cats.cats button:hover{
  border-color:var(--gold);
}

#cats.cats button.active{
  background:var(--gold);
  border-color:var(--gold);
  color:#111;
  font-weight:800;
}
.sectionTitle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:5px 0 14px;
  padding-bottom:9px;
  border-bottom:1px solid var(--line);
}

.sectionTitle h2{
  margin:0;
  font-weight:700;
  font-size:21px;
  line-height:1.2;
  text-transform:capitalize;
}

.sectionTitle span{
  font-size:12px;
  color:var(--muted);
}

.grid{
  display:grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap:14px;
}

.card{
  overflow:hidden;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow: 0 8px 25px rgba(0,0,0,.16);
  min-width:0;
  display:flex;
  flex-direction:column;
}

.photo {
  width: 100%;
  aspect-ratio: 16 / 9 !important;
  background: radial-gradient(circle at 50% 40%, #30281c, #171a18 70%);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #8e806a;
  text-align: center;
  padding: 0px; 
  overflow: hidden;
}

.photo img {
  width: 100%;
  height: 100%;
  object-fit: contain !important;
  border-radius: 0px;
  display: block;
  background-color: transparent;
}

.info{
  padding:12px;
  display:flex;
  flex-direction:column;
  flex:1;
}

.name{
  font-weight:700;
  font-size:17px;
  line-height:1.3;
  text-transform:capitalize;
  color:var(--text);
  overflow-wrap:anywhere;
}

.desc{
  font-size:12px;
  color:var(--muted);
  line-height:1.55;
  margin:5px 0 10px;
  min-height:34px;
  overflow-wrap:anywhere;
  flex:1;
}

.bottom{
  display:flex;
  align-items:flex-start;
  justify-content:flex-start;
  min-width:0;
}

.price{
  color:var(--gold2);
  font-weight:900;
  font-size:17px;
  line-height:1.2;
  white-space:nowrap;
  text-transform:none;
  min-width:0;
}

.price.multiPrice{
  white-space:normal;
  line-height:1.4;
  font-size:15px;
}

.empty{
  grid-column: 1 / -1;
  padding:35px 15px;
  text-align:center;
  color:var(--muted);
  border:1px dashed var(--line);
  border-radius:14px;
}

.footer{
  text-align:center;
  color:#777;
  font-size:11px;
  padding:25px 10px 35px;
  direction:ltr;
}

.admin{
  display:none;
  width:min(1100px,100%);
  margin:0 auto;
  padding:20px 14px 40px;
  direction:rtl;
  font-family: system-ui, -apple-system, sans-serif;
}

.admin.show{ display:block; }

.adminHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:20px;
}

.adminHead h2{ margin:0; font-size:24px; }
.adminActions{ display:flex; gap:8px; flex-wrap:wrap; }

.btn{
  border:1px solid var(--line);
  background:#151816;
  color:#eee;
  border-radius:9px;
  padding:9px 13px;
  font-weight:700;
}
.btn:hover{ border-color:var(--gold); }
.btn.gold{ background:var(--gold); border-color:var(--gold); color:#111; }
.btn.danger{ background:#351919; border-color:#5c2828; color:#f1caca; }

.adminGrid{
  display:grid;
  grid-template-columns: 380px minmax(0,1fr);
  gap:18px;
}

.panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:15px;
}

.panel h3{ margin:0 0 14px; font-size:18px; }
.formGroup{ margin-bottom:12px; }
.formGroup label{ display:block; margin-bottom:5px; color:#ddd; font-size:13px; font-weight:700; }

.formGroup input,
.formGroup textarea,
.formGroup select{
  width:100%;
  border:1px solid #3a352d;
  background:#0c0f0e;
  color:#fff;
  border-radius:9px;
  padding:10px 11px;
  outline:none;
}

.formGroup input:focus,
.formGroup textarea:focus,
.formGroup select:focus{ border-color:var(--gold); }
.formGroup textarea{ min-height:70px; resize:vertical; }

.formRow{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }

.langSectionDivider{
  border-top:1px solid var(--line);
  margin:14px 0 10px;
  padding-top:10px;
  color:var(--gold2);
  font-size:13px;
  font-weight:700;
}

.formButtons{ display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
.adminList{ display:grid; gap:10px; }

.adminItem{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:10px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#0c0f0e;
}

.adminItemInfo{ min-width:0; }
.adminItemName{ font-weight:700; font-size:16px; text-transform:capitalize; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.adminItemMeta{ color:var(--muted); font-size:11px; margin-top:3px; }
.adminItemActions{ display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }

.smallBtn{
  border:1px solid #3a352d;
  background:#151816;
  color:#ddd;
  border-radius:7px;
  padding:6px 9px;
  font-size:11px;
  font-weight:700;
}
.smallBtn:hover{ border-color:var(--gold); }
.smallBtn.active{ background:var(--gold); border-color:var(--gold); color:#111; }

.modal{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.78);
  padding:20px;
  z-index:9999;
  direction:rtl;
}
.modal.show{ display:flex; }

.modalBox{
  width:min(400px,100%);
  background:#111413;
  border:1px solid var(--line);
  border-radius:15px;
  padding:20px;
  box-shadow: 0 20px 70px rgba(0,0,0,.5);
}
.modalBox h2{ margin:0 0 16px; text-align:center; }
.modalButtons{ display:flex; gap:8px; margin-top:12px; }
.modalButtons button{ flex:1; }
.loginError{ color:#ef8d8d; font-size:12px; min-height:18px; margin-top:7px; }
.loading{ grid-column: 1 / -1; text-align:center; color:var(--muted); padding:30px 10px; }

@media(max-width:700px){
  .header{ padding-top:15px; }
  .logo{ width:min(190px,70vw); max-height:110px; }
  .public{ padding-left:10px; padding-right:10px; }
  .grid{ grid-template-columns: repeat(2,minmax(0,1fr)); gap:10px; }
  .photo{ aspect-ratio:1.25; }
  .info{ padding:10px; }
  .name{ font-size:16px; }
  .price{ font-size:16px; }
  .price.multiPrice{ font-size:14px; }
  .adminGrid{ grid-template-columns:1fr; }
  .adminHead{ align-items:flex-start; flex-direction:column; }
}

@media(max-width:430px){
  .name{ font-size:15px; }
  .price{ font-size:15px; }
  .price.multiPrice{ font-size:13px; line-height:1.35; }
  .cats button{ font-size:14px; padding:8px 13px; }
  .langBtn{ padding:5px 10px; font-size:12px; }
}

body.adminMode .public{ display:none; }
body.adminMode .admin{ display:block; }
body.adminMode .footer{ display:none; }
</style>
</head>
<body>

<div class="public" id="public">

<header class="header">
  <img class="logo" src="logo.webp" alt="SentoBene">

  <div id="langBar" class="langBar"></div>

  <div class="social">
    <span class="socialName" id="connectText">تواصل معنا</span>

    <div class="socialIcons">
      <!-- إنستجرام -->
      <a href="https://instagram.com/sentobene.eg/"
         target="_blank" rel="noopener noreferrer"
         aria-label="Instagram" class="icon-instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="1"/>
        </svg>
      </a>

      <!-- فيسبوك -->
      <a href="https://www.facebook.com/SentoBene.EG"
         target="_blank" rel="noopener noreferrer"
         aria-label="Facebook" class="icon-facebook">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M14 8h3V4h-3c-3.3 0-5 2-5 5v3H6v4h3v4h4v-4h3l1-4h-4V9c0-.7.3-1 1-1z"/>
        </svg>
      </a>

      <!-- واتساب -->
      <a href="https://wa.me/201206671717"
         target="_blank" rel="noopener noreferrer"
         aria-label="WhatsApp" class="icon-whatsapp">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.5 3.5A11.8 11.8 0 0 0 12.1 0C5.5 0 .2 5.3.2 11.9c0 2.1.5 4.1 1.6 5.9L0 24l6.3-1.7a11.9 11.9 0 0 0 5.7 1.5h.1c6.5 0 11.9-5.3 11.9-11.9a11.8 11.8 0 0 0-3.5-8.4ZM12 21.8a9.8 9.8 0 0 1-5-1.4l-.4-.2-3.7 1 1-3.7-.3-.4a9.8 9.8 0 0 1-1.5-5.2c0-5.5 4.4-9.9 9.9-9.9a9.8 9.8 0 0 1 7 2.9 9.8 9.8 0 0 1 2.9 7c0 5.5-4.4 9.9-9.9 9.9Zm5.4-7.4c-.3-.1-1.8-.9-2.1-1-.3-.1-.5-.1-.7.2l-.9 1.1c-.2.2-.4.2-.7.1-.3-.2-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.5-.6c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.2.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.3-.7.3-1.3.2-1.4-.1-.1-.3-.2-.6-.3Z"/>
        </svg>
      </a>

      <!-- تيك توك -->
      <a href="https://www.tiktok.com/@sentobene.eg"
         target="_blank" rel="noopener noreferrer"
         aria-label="TikTok" class="icon-tiktok">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.03 1.6 4.17.94 1.12 2.27 1.83 3.69 2.03v3.91c-1.32-.01-2.62-.35-3.77-1.02-.63-.37-1.19-.86-1.63-1.44v6.1c.07 2.63-1.2 5.17-3.41 6.57-2.18 1.4-5.01 1.62-7.39.58A7.27 7.27 0 0 1 1.5 14.73a7.17 7.17 0 0 1 1.81-7.14c1.8-1.78 4.51-2.3 6.84-1.32v4.06c-1.11-.53-2.45-.4-3.44.33-.94.67-1.43 1.84-1.25 2.99.18 1.11.96 2.05 2.01 2.44 1.13.43 2.44.17 3.32-.65.46-.41.72-.99.74-1.61V0h.01Z"/>
        </svg>
      </a>
    </div>
  </div>
</header>

<div id="vatNotice" style="text-align: center; color: #D4AF37; font-size: 14px; margin: 18px 0; font-weight: bold; letter-spacing: 0.5px;">
    * يضاف قيمة 14% ضريبة القيمة المضافة إلى الفاتورة * 
</div>

<div id="cats" class="cats"></div>

<section class="sectionTitle">
  <h2 id="sectionName">Pasta</h2>
  <span id="count">0 Items</span>
</section>

<main id="products" class="grid">
  <div class="loading">Loading...</div>
</main>

<footer class="footer">
  SentoBene®
</footer>

</div>
<section id="admin" class="admin">
  <div class="adminHead">
    <h2>SentoBene Admin</h2>
    <div class="adminActions">
      <button class="btn" onclick="showPublic()">عرض المينيو</button>
      <button class="btn danger" onclick="logout()">تسجيل الخروج</button>
    </div>
  </div>

  <div class="adminGrid">
    <div class="panel">
      <h3>إضافة / تعديل صنف</h3>
      <input type="hidden" id="editId">

      <div class="formGroup">
        <label>اسم الصنف (English - أساسي)</label>
        <input id="name" type="text" placeholder="Chicken Alfredo Pasta">
      </div>

      <div class="formGroup">
        <label>الوصف (English)</label>
        <textarea id="description" placeholder="Description in English"></textarea>
      </div>

      <div class="formRow">
        <div class="formGroup">
          <label>القسم</label>
          <select id="category"></select>
        </div>

        <div class="formGroup">
          <label>السعر بالجنيه</label>
          <input id="price" type="number" min="0" step="0.01" placeholder="140">
        </div>
      </div>

      <div class="formGroup">
        <label>صورة المنتج</label>
        <input id="image" type="file" accept="image/*">
      </div>

      <div class="langSectionDivider">الترجمات (اختياري)</div>

      <div class="formGroup">
        <label>الاسم بالعربية (name_ar)</label>
        <input id="name_ar" type="text" placeholder="مكرونة تشيكن ألفريدو">
      </div>
      <div class="formGroup">
        <label>الوصف بالعربية (description_ar)</label>
        <textarea id="description_ar" placeholder="وصف الصنف بالعربي"></textarea>
      </div>

      <div class="formGroup">
        <label>الاسم بالفرنسية (name_fr)</label>
        <input id="name_fr" type="text" placeholder="Nom en français">
      </div>
      <div class="formGroup">
        <label>الوصف بالفرنسية (description_fr)</label>
        <textarea id="description_fr" placeholder="Description en français"></textarea>
      </div>

      <div class="formGroup">
        <label>الاسم بالألمانية (name_de)</label>
        <input id="name_de" type="text" placeholder="Name auf Deutsch">
      </div>
      <div class="formGroup">
        <label>الوصف بالألمانية (description_de)</label>
        <textarea id="description_de" placeholder="Beschreibung auf Deutsch"></textarea>
      </div>

      <div class="formGroup">
        <label>الاسم بالصينية (name_zh)</label>
        <input id="name_zh" type="text" placeholder="中文名称">
      </div>
      <div class="formGroup">
        <label>الوصف بالصينية (description_zh)</label>
        <textarea id="description_zh" placeholder="中文描述"></textarea>
      </div>

      <div class="formButtons">
        <button class="btn gold" onclick="saveProduct()">حفظ الصنف</button>
        <button class="btn" onclick="clearForm()">إلغاء</button>
      </div>
    </div>

    <div class="panel">
      <h3>الأصناف</h3>
      <div id="adminList" class="adminList">
        <div class="loading">Loading...</div>
      </div>
    </div>
  </div>
</section>

<div id="loginModal" class="modal">
  <div class="modalBox">
    <h2>دخول إدارة SentoBene</h2>

    <div class="formGroup">
      <label>البريد الإلكتروني</label>
      <input id="loginEmail" type="email" autocomplete="username" placeholder="Email">
    </div>

const UI_TEXT = {

  }
};

const cats = [
  { db:'FRIDAY OFFER', en:'Friday Offer', ar:'عرض الجمعة', fr:'Offre du Vendredi', de:'Freitagsangebot', zh:'周五特惠' },
  { db:'PASTA', en:'Pasta', ar:'باستا', fr:'Pâtes', de:'Pasta', zh:'意面' },
  { db:'SANDWICHES', en:'Sandwiches', ar:'ساندوتشات', fr:'Sandwichs', de:'Sandwiches', zh:'三明治' },
  { db:'PORIZZA', en:'Purezza', ar:'بوريتزا', fr:'Purezza', de:'Purezza', zh:'比萨' },
  { db:'MAIN COURSE', en:'Main Course', ar:'الأطباق الرئيسية', fr:'Plats Principaux', de:'Hauptgerichte', zh:'主菜' },
  { db:'SIDE ITEM', en:'Side Items', ar:'أصناف جانبية', fr:'Accompagnements', de:'Beilagen', zh:'配菜' },
  { db:'DESSERTS', en:'Desserts', ar:'حلويات', fr:'Desserts', de:'Desserts', zh:'甜点' },
  { db:'SPECIAL MOCKTAILS', en:'Special Mocktails', ar:'موكتيلات خاصة', fr:'Mocktails Spéciaux', de:'Spezielle Mocktails', zh:'特调无酒精鸡尾酒' },
  { db:'HOT DRINKS', en:'Hot Drinks', ar:'مشروبات ساخنة', fr:'Boissons Chaudes', de:'Heiße Getränke', zh:'热饮' },
  { db:'FRESH JUICE', en:'Fresh Juices', ar:'عصائر طازجة', fr:'Jus Frais', de:'Frische Säfte', zh:'鲜榨果汁' },
  { db:'MILK SHAKE', en:'Milkshakes', ar:'ميلك شيك', fr:'Milkshakes', de:'Milchshakes', zh:'奶昔' },

];
let products = [];
let activeLang = 'ar';
let active = cats[0].db;

function esc(value){
  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function titleCase(text){
  return String(text || '')
    .toLowerCase()
    .replace(/\b\w/g, char => char.toUpperCase());
}

function getLocalizedField(item, fieldBase) {
  if (activeLang === 'en') return item[fieldBase] || '';
  const localizedValue = item[`${fieldBase}_${activeLang}`];
  return (localizedValue && localizedValue.trim() !== '') ? localizedValue : (item[fieldBase] || '');
}

function renderLangBar() {
  const container = document.getElementById('langBar');
  if (!container) return;

  container.innerHTML = SUPPORTED_LANGUAGES.map(lang => `
    <button 
      class="langBtn ${lang.code === activeLang ? 'active' : ''}" 
      onclick="setLanguage('${lang.code}')"
      aria-label="${lang.label}"
    >
      <span style="width:18px;height:18px;border-radius:50%;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 2px rgba(0,0,0,0.5);">
        ${FLAG_SVGS[lang.code]}
      </span>
      <span>${lang.label}</span>
    </button>
  `).join('');
}

function setLanguage(langCode) {
  const langObj = SUPPORTED_LANGUAGES.find(l => l.code === langCode);
  if (!langObj) return;

  activeLang = langCode;
  document.documentElement.lang = langCode;
  document.documentElement.dir = langObj.dir;

  const ui = UI_TEXT[activeLang] || UI_TEXT.en;
  document.getElementById('connectText').textContent = ui.connect;
  document.getElementById('vatNotice').textContent = ui.vat;

  renderLangBar();
  renderPublic();
}

function setupCats(){
  const container = document.getElementById('cats');

  container.innerHTML = cats.map(c => {
    const catLabel = c[activeLang] || c.en;
    const displayLabel = activeLang === 'en' ? titleCase(catLabel) : catLabel;
    return `
      <button
        class="${c.db === active ? 'active' : ''}"
        onclick="selectCategory('${c.db}')"
      >
        ${esc(displayLabel)}
      </button>
    `;
  }).join('');
}

function selectCategory(category){
  active = category;
  renderPublic();
}
async function loadPublic(){
  const container = document.getElementById('products');
  container.innerHTML = `<div class="loading">Loading...</div>`;

  const { data, error } = await sb
    .from('products')
    .select('*')
    .eq('available', true)
    .order('created_at', { ascending: false });

  if(error){
    console.error(error);
    container.innerHTML = `<div class="empty">حصل خطأ أثناء تحميل المينيو.</div>`;
    return;
  }

  products = data || [];
  renderPublic();
}

function renderPublic(){
  setupCats();
  const ui = UI_TEXT[activeLang] || UI_TEXT.en;

  let sectionProducts = products.filter(x => x.category === active);

  if(active === 'HOT DRINKS'){
    sectionProducts.sort((a,b) => {
      const aName = String(a.name || '').trim().toLowerCase();
      const bName = String(b.name || '').trim().toLowerCase();
      const order = { 'espresso': 0, 'turkish coffee': 1 };
      const aOrder = Object.prototype.hasOwnProperty.call(order, aName) ? order[aName] : 2;
      const bOrder = Object.prototype.hasOwnProperty.call(order, bName) ? order[bName] : 2;
      return aOrder - bOrder;
    });
  }

  const currentCat = cats.find(c => c.db === active);
  const rawSectionName = currentCat ? (currentCat[activeLang] || currentCat.en) : active;
  document.getElementById('sectionName').textContent = activeLang === 'en' ? titleCase(rawSectionName) : rawSectionName;

  document.getElementById('count').textContent = `${sectionProducts.length} ${sectionProducts.length === 1 ? ui.item : ui.items}`;

  const container = document.getElementById('products');

  if(!sectionProducts.length){
    container.innerHTML = `<div class="empty">${esc(ui.empty)}</div>`;
    return;
  }

  container.innerHTML = sectionProducts.map(x => {
    const baseName = String(x.name || '').trim().toLowerCase();
    const isEspresso = baseName === 'espresso';
    const isTurkishCoffee = baseName === 'turkish coffee';
    const isMultiPrice = isEspresso || isTurkishCoffee;

    const rawName = getLocalizedField(x, 'name');
    const displayName = activeLang === 'en' ? titleCase(rawName) : rawName;
    const displayDescription = esc(getLocalizedField(x, 'description'));

    const displayPrice = isEspresso
      ? 'Single 68 EGP<br>Double 72 EGP'
      : isTurkishCoffee
        ? 'Single 63 EGP<br>Double 72 EGP'
        : `${ui.currency} ${Number(x.price).toLocaleString('en-US')}`;

    return `
      <div class="card">
        <div class="photo">
          ${
            x.image_url
              ? `<img src="${esc(x.image_url)}" alt="${esc(displayName)}" loading="lazy">`
              : esc(ui.noImage)
          }
        </div>

        <div class="info">
          <div class="name">${esc(displayName)}</div>
          <div class="desc">${displayDescription}</div>
          <div class="bottom">
            <div class="price ${isMultiPrice ? 'multiPrice' : ''}">${displayPrice}</div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}
function showPublic(){
  document.body.classList.remove('adminMode');
}

function showAdmin(){
  document.body.classList.add('adminMode');
  loadAdmin();
}

function openLogin(){
  document.getElementById('loginModal').classList.add('show');
  setTimeout(() => { document.getElementById('loginEmail').focus(); }, 100);
}

function closeLogin(){
  document.getElementById('loginModal').classList.remove('show');
  document.getElementById('loginError').textContent = '';
}

async function login(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errorBox = document.getElementById('loginError');
  errorBox.textContent = '';

  if(!email || !password){
    errorBox.textContent = 'اكتب البريد الإلكتروني وكلمة المرور.';
    return;
  }

  const { data, error } = await sb.auth.signInWithPassword({ email, password });

  if(error){
    console.error(error);
    errorBox.textContent = 'بيانات الدخول غير صحيحة.';
    return;
  }

  if(data?.user){
    closeLogin();
    showAdmin();
  }
}

async function logout(){
  await sb.auth.signOut();
  showPublic();
}

async function loadAdmin(){
  const list = document.getElementById('adminList');
  list.innerHTML = `<div class="loading">Loading...</div>`;

  const { data, error } = await sb
    .from('products')
    .select('*')
    .order('created_at', { ascending: false });

  if(error){
    console.error(error);
    list.innerHTML = `<div class="empty">حصل خطأ أثناء تحميل الأصناف.</div>`;
    return;
  }

  const allProducts = data || [];

  if(!allProducts.length){
    list.innerHTML = `<div class="empty">لا توجد أصناف حتى الآن.</div>`;
    return;
  }

  list.innerHTML = allProducts.map(x => `
    <div class="adminItem">
      <div class="adminItemInfo">
        <div class="adminItemName">${esc(titleCase(x.name))} ${x.name_ar ? `(${esc(x.name_ar)})` : ''}</div>
        <div class="adminItemMeta">
          ${esc(x.category)} — ${Number(x.price).toLocaleString('en-US')} EGP — ${x.available ? 'متاح' : 'مخفي'}
        </div>
      </div>

      <div class="adminItemActions">
        <button class="smallBtn ${x.available ? 'active' : ''}" onclick="toggleAvailability(${x.id},${x.available})">
          ${x.available ? 'إخفاء' : 'إظهار'}
        </button>
        <button class="smallBtn" onclick="editProduct(${x.id})">تعديل</button>
        <button class="smallBtn" onclick="deleteProduct(${x.id})">حذف</button>
      </div>
    </div>
  `).join('');
}

function setupAdminCategorySelect(){
  const select = document.getElementById('category');
  select.innerHTML = cats.map(c => `<option value="${esc(c.db)}">${esc(titleCase(c.en))}</option>`).join('');
}

function clearForm(){
  ['editId', 'name', 'description', 'price', 'image', 'name_ar', 'description_ar', 'name_fr', 'description_fr', 'name_de', 'description_de', 'name_zh', 'description_zh'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('category').value = cats[0].db;
}

async function editProduct(id){
  const { data, error } = await sb.from('products').select('*').eq('id', id).single();

  if(error){
    alert('حصل خطأ أثناء تحميل الصنف.');
    return;
  }

  document.getElementById('editId').value = data.id;
  document.getElementById('name').value = data.name || '';
  document.getElementById('description').value = data.description || '';
  document.getElementById('category').value = data.category;
  document.getElementById('price').value = data.price;
  document.getElementById('image').value = '';

  document.getElementById('name_ar').value = data.name_ar || '';
  document.getElementById('description_ar').value = data.description_ar || '';
  document.getElementById('name_fr').value = data.name_fr || '';
  document.getElementById('description_fr').value = data.description_fr || '';
  document.getElementById('name_de').value = data.name_de || '';
  document.getElementById('description_de').value = data.description_de || '';
  document.getElementById('name_zh').value = data.name_zh || '';
  document.getElementById('description_zh').value = data.description_zh || '';

  window.scrollTo({ top: 0, behavior: 'smooth' });
}
async function saveProduct(){
  const editId = document.getElementById('editId').value;
  const name = document.getElementById('name').value.trim();
  const description = document.getElementById('description').value.trim();
  const category = document.getElementById('category').value;
  const price = Number(document.getElementById('price').value);
  const imageFile = document.getElementById('image').files[0];

  const translations = {
    name_ar: document.getElementById('name_ar').value.trim() || null,
    description_ar: document.getElementById('description_ar').value.trim() || null,
    name_fr: document.getElementById('name_fr').value.trim() || null,
    description_fr: document.getElementById('description_fr').value.trim() || null,
    name_de: document.getElementById('name_de').value.trim() || null,
    description_de: document.getElementById('description_de').value.trim() || null,
    name_zh: document.getElementById('name_zh').value.trim() || null,
    description_zh: document.getElementById('description_zh').value.trim() || null
  };

  if(!name){ alert('اكتب اسم الصنف.'); return; }
  if(!category){ alert('اختار القسم.'); return; }
  if(Number.isNaN(price)){ alert('اكتب السعر.'); return; }

  let imageUrl = null;

  if(editId){
    const { data:oldProduct, error:oldError } = await sb.from('products').select('*').eq('id', editId).single();
    if(oldError){ alert('حصل خطأ أثناء تحميل الصنف.'); return; }
    imageUrl = oldProduct.image_url || null;

    if(imageFile){
      const fileExt = imageFile.name.split('.').pop().toLowerCase();
      const fileName = `${Date.now()}-${Math.random().toString(36).slice(2)}.${fileExt}`;
      const { error:uploadError } = await sb.storage.from('product-images').upload(fileName, imageFile, { upsert: false });
      if(uploadError){ alert('حصل خطأ أثناء رفع الصورة.'); return; }
      const { data:publicData } = sb.storage.from('product-images').getPublicUrl(fileName);
      imageUrl = publicData.publicUrl;
    }

    const { error:updateError } = await sb
      .from('products')
      .update({ name, description, category, price, image_url: imageUrl, ...translations })
      .eq('id', editId);

    if(updateError){ alert('حصل خطأ أثناء حفظ التعديل.'); return; }
    alert('تم تعديل الصنف بنجاح.');
  } else {
    if(imageFile){
      const fileExt = imageFile.name.split('.').pop().toLowerCase();
      const fileName = `${Date.now()}-${Math.random().toString(36).slice(2)}.${fileExt}`;
      const { error:uploadError } = await sb.storage.from('product-images').upload(fileName, imageFile, { upsert: false });
      if(uploadError){ alert('حصل خطأ أثناء رفع الصورة.'); return; }
      const { data:publicData } = sb.storage.from('product-images').getPublicUrl(fileName);
      imageUrl = publicData.publicUrl;
    }

    const { error:insertError } = await sb
      .from('products')
      .insert({ name, description, category, price, image_url: imageUrl, available: true, ...translations });

    if(insertError){ alert('حصل خطأ أثناء إضافة الصنف.'); return; }
    alert('تم إضافة الصنف بنجاح.');
  }

  clearForm();
  await loadAdmin();
  await loadPublic();
}

async function toggleAvailability(id, current){
  const { error } = await sb.from('products').update({ available: !current }).eq('id', id);
  if(error){ alert('حصل خطأ أثناء تغيير حالة الصنف.'); return; }
  await loadAdmin();
  await loadPublic();
}

async function deleteProduct(id){
  if(!confirm('هل أنت متأكد من حذف هذا الصنف؟')) return;
  const { error } = await sb.from('products').delete().eq('id', id);
  if(error){ alert('حصل خطأ أثناء حذف الصنف.'); return; }
  alert('تم حذف الصنف.');
  await loadAdmin();
  await loadPublic();
}

function isAdminUrl(){
  return new URLSearchParams(window.location.search).get('admin') === '1';
}

sb.auth.onAuthStateChange(async (event, session) => {
  if(event === 'SIGNED_OUT'){ showPublic(); return; }
  if(event === 'SIGNED_IN' && session?.user && isAdminUrl()){ showAdmin(); }
});

renderLangBar();
setupAdminCategorySelect();
showPublic();
loadPublic();

document.addEventListener('keydown', event => {
  if(event.ctrlKey && event.shiftKey && event.key.toLowerCase() === 'a'){
    event.preventDefault();
    openLogin();
  }
});

if(isAdminUrl()){
  openLogin();
}
</script>
