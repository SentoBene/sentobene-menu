<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SentoBene | Menu</title>
<style>
:root{--bg:#090b0a;--card:#111413;--gold:#d7a33a;--gold2:#f0c15d;--text:#f7f3eb;--muted:#aaa49b;--line:#302b23}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Tahoma,sans-serif}
body{min-height:100vh}button,input,textarea,select{font:inherit}
.header{position:sticky;top:0;z-index:50;background:rgba(9,11,10,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:15px 16px 12px;text-align:center}
.logo{width:118px;display:block;margin:auto;mix-blend-mode:screen}.tag{color:var(--gold2);font-size:11px;margin-top:5px}
.wrap{max-width:920px;margin:auto;padding:14px 14px 34px}
.hero{border:1px solid #403521;border-radius:20px;overflow:hidden;background:linear-gradient(120deg,#101210,#241b0e);padding:22px 20px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.hero h1{font:700 30px Georgia,serif;margin:0 0 7px}.hero p{margin:0;color:#d5c5a7;font-size:12px}.hero .mark{font-size:34px;color:var(--gold)}
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 1px 14px;scrollbar-width:none;direction:ltr}.cats::-webkit-scrollbar{display:none}
.cats button{direction:rtl;white-space:nowrap;border:1px solid #3a352d;background:#111413;color:#ddd;border-radius:999px;padding:9px 14px}
.cats button.active{background:var(--gold);border-color:var(--gold);color:#111;font-weight:800}
.sectionTitle{display:flex;justify-content:space-between;align-items:end;margin:5px 0 12px}.sectionTitle h2{margin:0;font-size:21px}.sectionTitle span{font-size:11px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--card);border:1px solid #292a26;border-radius:17px;overflow:hidden;box-shadow:0 8px 25px #0004}
.photo{width:100%;aspect-ratio:1.2;background:radial-gradient(circle at 50% 40%,#30281c,#171a18 70%);display:flex;align-items:center;justify-content:center;color:#8e806a;text-align:center;padding:20px}
.photo img{width:100%;height:100%;object-fit:cover}.info{padding:12px}
.name{font-weight:800;font-size:16px;line-height:1.3}.desc{font-size:12px;color:var(--muted);line-height:1.55;margin:5px 0 10px;min-height:34px}
.bottom{display:flex;align-items:center;justify-content:space-between;gap:8px}.price{color:var(--gold2);font-weight:900}.add{border:1px solid var(--gold);background:var(--gold);color:#111;border-radius:9px;padding:7px 11px;font-weight:700}
.empty{border:1px dashed #3a362f;border-radius:16px;padding:42px 15px;text-align:center;color:#aaa;grid-column:1/-1}
.footer{text-align:center;color:#6f6b64;font-size:11px;padding:30px 0}
.admin{display:none}.admin.show{display:block}.public.hide{display:none}
.panel{background:#101311;border:1px solid #2d2b26;border-radius:16px;padding:15px;margin-bottom:12px}
.panel h2,.panel h3{margin:0 0 12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:12px;color:#c7c1b7}input,textarea,select{width:100%;margin:5px 0 10px;padding:11px;border-radius:9px;border:1px solid #3a3731;background:#0a0c0b;color:#fff;outline:none}
textarea{min-height:80px;resize:vertical}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--gold);color:#111;font-weight:800;cursor:pointer}.btn.dark{background:#272622;color:#eee}
.items{display:grid;gap:8px}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid #2b2b27;border-radius:11px;padding:10px}
.small{font-size:11px;color:#999}.status{border:0;border-radius:20px;padding:7px 10px;background:#173a23;color:#77e497}.status.off{background:#482020;color:#ff9c9c}
.preview{width:64px;height:64px;object-fit:cover;border-radius:9px;background:#222;display:block;margin-bottom:10px}
@media(max-width:600px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.hero h1{font-size:25px}}
</style>
</head>

<main class="wrap">
<section id="public" class="public">

<script>
const cats=["PASTA","SANDWICHES","PORIZZA","MAIN COURSE","SIDE ITEM","DESSERTS","SPECIAL MOCKTAILS","HOT DRINKS","FRESH JUICE","MILK SHAKE","ICED DRINKS"];
const demo=[
{n:"Chicken Alfredo Pasta",d:"مكرونة بالدجاج مع صوص الألفريدو والجبن",p:140,c:"PASTA",i:"",on:true},
{n:"Penne Arrabbiata",d:"مكرونة بيني بصوص الطماطم الحار",p:120,c:"PASTA",i:"",on:true},
{n:"Spaghetti Bolognese",d:"مكرونة سباجيتي بصلصة بولونيز",p:130,c:"PASTA",i:"",on:true},
{n:"Pesto Pasta",d:"مكرونة بصوص البيستو",p:125,c:"PASTA",i:"",on:true},
{n:"Chicken Sandwich",d:"ساندوتش دجاج بصوص خاص",p:160,c:"SANDWICHES",i:"",on:true},
{n:"Margherita Porizza",d:"طماطم وموتزاريلا وريحان",p:170,c:"PORIZZA",i:"",on:true}
];
let products=JSON.parse(localStorage.getItem("sento_v5")||"null")||demo;
let active=cats[0];
function persist(){localStorage.setItem("sento_v5",JSON.stringify(products));render()}
function render(){
document.getElementById("cats").innerHTML=cats.map(c=>`<button class="${c===active?'active':''}" onclick="active='${c}';render()">${c}</button>`).join("");
document.getElementById("sectionName").textContent=active;
const arr=products.filter(x=>x.c===active&&x.on);
document.getElementById("count").textContent=arr.length+" أصناف";
document.getElementById("products").innerHTML=arr.length?arr.map(x=>`<article class="card"><div class="photo">${x.i?`<img src="${x.i}" alt="">`:`<span>صورة المنتج<br><small>تُضاف من لوحة التحكم</small></span>`}</div><div class="info"><div class="name">${x.n}</div><div class="desc">${x.d}</div><div class="bottom"><span class="price">${Number(x.p).toLocaleString("en-US")} EGP</span><button class="add">إضافة</button></div></div></article>`).join(""):`<div class="empty">لا توجد أصناف متاحة حاليًا في هذا القسم.</div>`;
document.getElementById("adminItems").innerHTML=products.map((x,i)=>`<div class="item"><div><b>${x.n}</b><div class="small">${x.c} • ${x.p} EGP</div></div><button class="status ${x.on?'':'off'}" onclick="products[${i}].on=!products[${i}].on;persist()">${x.on?'متاح':'غير متاح'}</button></div>`).join("");
}
function setup(){document.getElementById("pcat").innerHTML=cats.map(c=>`<option>${c}</option>`).join("")}
function addProduct(){
const n=document.getElementById("pname").value.trim(); if(!n) return alert("اكتب اسم الصنف");
const file=document.getElementById("pimage").files[0];
const done=(img)=>{products.push({n,d:document.getElementById("pdesc").value.trim(),p:Number(document.getElementById("pprice").value||0),c:document.getElementById("pcat").value,i:img||"",on:true});["pname","pdesc","pprice"].forEach(id=>document.getElementById(id).value="");document.getElementById("pimage").value="";document.getElementById("preview").style.display="none";persist()};
if(file){const r=new FileReader();r.onload=()=>done(r.result);r.readAsDataURL(file)}else done("");
}
document.getElementById("pimage").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{preview.src=r.result;preview.style.display="block"};r.readAsDataURL(f)});
function showAdmin(){document.getElementById("public").classList.add("hide");document.getElementById("admin").classList.add("show");setup();render()}
function showPublic(){document.getElementById("admin").classList.remove("show");document.getElementById("public").classList.remove("hide");render()}
document.addEventListener("keydown",e=>{if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==="a")showAdmin()});
setup();render();
</script>
